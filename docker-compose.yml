version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: flowpoint-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://flowpoint:${POSTGRES_PASSWORD:-secret}@postgres:5432/flowpoint
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - flowpoint

  postgres:
    image: postgres:15-alpine
    container_name: flowpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowpoint
      POSTGRES_USER: flowpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpoint -d flowpoint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowpoint

  redis:
    image: redis:7-alpine
    container_name: flowpoint-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowpoint

volumes:
  postgres_data:
  redis_data:

networks:
  flowpoint:
    driver: bridge
