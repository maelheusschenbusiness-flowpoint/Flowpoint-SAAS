<!-- =====================================================
     OPTIONAL SCRIPT PATCHES
===================================================== -->

<script>

  // Sidebar overlay sync

  const originalToggleSidebar =
    window.toggleSidebar;

  window.toggleSidebar =
    function() {

      const sidebar =
        document.getElementById(
          "fpSidebar"
        );

      const overlay =
        document.getElementById(
          "fpMobileOverlay"
        );

      sidebar.classList.toggle(
        "mobile-open"
      );

      overlay.classList.toggle(
        "visible"
      );

    };

  // Auto close sidebar on route

  const originalNavigateTo =
    window.navigateTo;

  window.navigateTo =
    function(route) {

      const sidebar =
        document.getElementById(
          "fpSidebar"
        );

      const overlay =
        document.getElementById(
          "fpMobileOverlay"
        );

      sidebar.classList.remove(
        "mobile-open"
      );

      overlay.classList.remove(
        "visible"
      );

      window.location.hash =
        route;

    };

  // ESC close modals

  document.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Escape"
      ) {

        document
        .querySelectorAll(
          ".fpModalOverlay"
        )
        .forEach(
          (item) =>
            item.remove()
        );

        document
        .querySelectorAll(
          ".fpCommandPaletteOverlay"
        )
        .forEach(
          (item) =>
            item.remove()
        );

      }

    }
  );

</script>
