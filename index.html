<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    FlowPoint — Essai 14 jours
  </title>

  <meta
    name="color-scheme"
    content="dark"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/flowpoint-logo.svg"
  />

  <link
    rel="shortcut icon"
    href="/assets/flowpoint-logo.svg"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --bg:#070b18;
      --card:rgba(13,18,40,.82);

      --text:#f1f5ff;
      --muted:#aab7e1;

      --border:
        rgba(255,255,255,.10);

      --primary:#2f5bff;

      --field:#10182d;

      --fieldBorder:
        rgba(255,255,255,.10);

      --shadow:
        0 18px 70px rgba(0,0,0,.45);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;

      font-family:
        Inter,
        system-ui,
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          1200px 700px
          at 10% 0%,
          rgba(47,91,255,.18),
          transparent 60%
        ),

        radial-gradient(
          1200px 700px
          at 90% 0%,
          rgba(99,102,241,.18),
          transparent 60%
        ),

        var(--bg);

      min-height:100vh;
    }

    .wrap{
      width:100%;
      max-width:980px;

      margin:auto;

      padding:
        52px 20px;
    }

    .topbar{
      display:flex;

      align-items:flex-start;

      justify-content:
        space-between;

      gap:20px;

      margin-bottom:24px;
    }

    .brand{
      display:flex;

      align-items:flex-start;

      gap:14px;
    }

    .brandLogo{
      width:50px;
      height:50px;

      object-fit:contain;

      border:none;
      outline:none;

      background:transparent;

      box-shadow:none;

      flex:0 0 auto;
    }

    .brandText h1{
      margin:0;

      font-size:38px;

      line-height:1;

      font-weight:800;

      letter-spacing:-0.05em;
    }

    .sub{
      margin-top:8px;

      color:var(--muted);

      font-size:14px;

      line-height:1.5;
    }

    .topActions{
      display:flex;

      align-items:center;

      gap:12px;

      padding-top:2px;
    }

    .linkBtn{
      height:42px;

      padding:0 16px;

      border-radius:999px;

      display:flex;

      align-items:center;

      justify-content:center;

      text-decoration:none;

      font-size:13px;

      font-weight:700;

      color:#8ea8ff;

      background:
        rgba(47,91,255,.10);

      border:
        1px solid
        rgba(47,91,255,.18);

      transition:.18s;
    }

    .linkBtn:hover{
      transform:translateY(-1px);

      background:
        rgba(47,91,255,.18);
    }

    .card{
      background:var(--card);

      border:
        1px solid
        var(--border);

      border-radius:22px;

      padding:22px;

      backdrop-filter:
        blur(18px)
        saturate(180%);

      box-shadow:
        var(--shadow);
    }

    .grid{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:16px;
    }

    @media(max-width:760px){
      .grid{
        grid-template-columns:1fr;
      }

      .topbar{
        flex-direction:column;
      }
    }

    label{
      display:block;

      margin-bottom:8px;

      font-size:13px;

      font-weight:700;
    }

    .field{
      margin-bottom:16px;
    }

    input,
    select{
      width:100%;

      height:52px;

      border-radius:14px;

      border:
        1px solid
        var(--fieldBorder);

      background:var(--field);

      color:var(--text);

      padding:0 16px;

      font-size:14px;

      outline:none;
    }

    input:focus,
    select:focus{
      border-color:
        rgba(47,91,255,.55);

      box-shadow:
        0 0 0 4px
        rgba(47,91,255,.14);
    }

    button{
      width:100%;

      height:54px;

      border:none;

      border-radius:14px;

      background:
        linear-gradient(
          180deg,
          #3464ff,
          #2450ff
        );

      color:white;

      font-size:15px;

      font-weight:700;

      cursor:pointer;

      transition:.18s;
    }

    button:hover{
      transform:translateY(-1px);
    }

    #msg{
      margin-top:14px;

      font-size:14px;

      font-weight:600;
    }

    .error{
      color:#ff5d73;
    }

    .success{
      color:#59d98e;
    }

    .note{
      margin-top:16px;

      color:var(--muted);

      font-size:13px;

      line-height:1.5;
    }
      </style>
</head>

<body>
  <div class="wrap">

    <div class="topbar">

      <div class="brand">
        <img
          class="brandLogo"
          src="/assets/flowpoint-logo.svg"
          alt="FlowPoint"
        />

        <div class="brandText">
          <h1>
            FlowPoint
          </h1>

          <div class="sub">
            Essai gratuit 14 jours —
            carte requise.
            Accès bloqué si paiement échoue.
          </div>
        </div>
      </div>

      <div class="topActions">
        <a
          href="/pricing.html"
          class="linkBtn"
        >
          Voir les offres
        </a>

        <a
          href="/login.html"
          class="linkBtn"
        >
          Se connecter
        </a>
      </div>

    </div>

    <div class="card">

      <form id="signupForm">

        <div class="grid">

          <div class="field">
            <label>
              Prénom
            </label>

            <input
              id="firstName"
              type="text"
              placeholder="Jean"
              required
            />
          </div>

          <div class="field">
            <label>
              Email
            </label>

            <input
              id="email"
              type="email"
              placeholder="jean@entreprise.com"
              required
            />
          </div>

        </div>

        <div class="field">
          <label>
            Entreprise
          </label>

          <input
            id="companyName"
            type="text"
            placeholder="Entreprise ABC"
          />
        </div>

        <div class="field">
          <label>
            Offre
          </label>

          <select id="plan">
            <option value="standard">
              Standard
            </option>

            <option
              value="pro"
              selected
            >
              Pro
            </option>

            <option value="ultra">
              Ultra
            </option>
          </select>
        </div>

        <button type="submit">
          Commencer l’essai
        </button>

        <div id="msg"></div>

        <div class="note">
          En continuant,
          tu acceptes les emails
          d’alertes et rapports FlowPoint.
        </div>

      </form>

    </div>

  </div>

 <script>
  const form =
    document.getElementById(
      'signupForm'
    );

  const btn =
    document.getElementById(
      'btn'
    );

  const msg =
    document.getElementById(
      'msg'
    );

  function setMsg(
    text,
    ok = false
  ) {
    msg.innerHTML = `
      <div style="
        padding:12px;
        border-radius:12px;
        margin-top:12px;
        font-size:14px;
        font-weight:600;
        background:${
          ok
            ? 'rgba(16,185,129,.12)'
            : 'rgba(239,68,68,.12)'
        };
        color:${
          ok
            ? '#10b981'
            : '#ef4444'
        };
        border:1px solid ${
          ok
            ? 'rgba(16,185,129,.25)'
            : 'rgba(239,68,68,.25)'
        };
      ">
        ${text}
      </div>
    `;
  }

  async function signup(
    payload
  ) {
    const response =
      await fetch(
        '/api/auth/register',
        {
          method: 'POST',

          credentials:
            'include',

          headers: {
            'Content-Type':
              'application/json',
          },

          body:
            JSON.stringify(
              payload
            ),
        }
      );

    const data =
      await response.json();

    return {
      ok: response.ok,
      data,
    };
  }

  form.addEventListener(
    'submit',
    async (e) => {
      e.preventDefault();

      btn.disabled = true;

      btn.textContent =
        'Création...';

      try {
        const firstName =
          document
            .getElementById(
              'firstName'
            )
            .value.trim();

        const email =
          document
            .getElementById(
              'email'
            )
            .value.trim();

        const companyName =
          document
            .getElementById(
              'companyName'
            )
            .value.trim();

        const plan =
          document
            .getElementById(
              'plan'
            )
            .value;

        if (
          !firstName ||
          !email
        ) {
          throw new Error(
            'Informations manquantes'
          );
        }

        const password =
          crypto.randomUUID();

        const result =
          await signup({
            firstName,
            email,
            password,
            companyName,
            plan,
          });

        if (
          !result.ok ||
          !result.data?.ok
        ) {
          throw new Error(
            result.data
              ?.error ||
              'Erreur inscription'
          );
        }

        if (
          result.data.token
        ) {
          localStorage.setItem(
            'fp_token',
            result.data.token
          );
        }

        setMsg(
          'Compte créé avec succès. Redirection...',
          true
        );

        setTimeout(() => {
          window.location.href =
            '/dashboard.html';
        }, 1200);
      } catch (err) {
        console.error(err);

        setMsg(
          err.message ||
            'Erreur serveur'
        );
      } finally {
        btn.disabled =
          false;

        btn.textContent =
          'Commencer l’essai';
      }
    }
  );
</script>

</body>
</html>
