    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
    <style>
      #root:empty {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        background: #f1f5ff;
      }
      #root:empty::before {
        content: 'F';
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 11px;
        color: #fff;
        background: #315de8;
        font: 700 24px Outfit, sans-serif;
      }
      #root:empty::after {
        content: 'FlowPoint';
        color: #475569;
        font: 600 13px "Plus Jakarta Sans", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #root:empty { background: #111b2d; }
        #root:empty::after { color: #e2e8f0; }
      }
    </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://flowpoint.pro/#website",
          "url": "https://flowpoint.pro/",
          "name": "FlowPoint",
          "description": "FlowPoint is a SaaS workspace for SEO, local search, competitor analysis, website monitoring, analytics, reporting and AI-supported recommendations for teams.",
          "inLanguage": "en"
        },
        {
          "@type": "Organization",
          "@id": "https://flowpoint.pro/#organization",
          "name": "FlowPoint",
          "url": "https://flowpoint.pro/",
          "logo": "https://flowpoint.pro/favicon.svg?v=2",
          "email": "support@flowpoint.pro",
          "vatID": "BE1038.273.845",
          "description": "FlowPoint is a SaaS workspace for SEO, local search, competitor analysis, website monitoring, analytics, reporting and AI-supported recommendations for teams.",
          "sameAs": [
            "https://www.instagram.com/flowpoint.pro/",
            "https://www.tiktok.com/@flowpoint.pro"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <script>
      (function() {
        try {
          var supportedLanguages = [
            "en", "fr", "es", "de", "it", "pt", "nl", "pl", "ru", "uk",
            "cs", "ro", "hu", "sv", "da", "no", "fi", "el", "tr", "ar",
            "he", "hi", "zh-CN", "zh-TW", "ja", "ko", "th", "vi", "id", "ms"
          ];
          var sourceLanguage = "en";
          var cookieMatch = document.cookie.match(
            new RegExp("(?:^|;\\s*)googtrans=/" + sourceLanguage + "/([^;]+)", "i")
          );
          var queryLanguage = new URLSearchParams(window.location.search).get("lang");
          var requestedLanguage = supportedLanguages.find(function(code) {
            return queryLanguage && code.toLowerCase() === queryLanguage.toLowerCase();
          });
          var cookieLanguage = supportedLanguages.find(function(code) {
            return cookieMatch && code.toLowerCase() === cookieMatch[1].toLowerCase();
          });
          var savedLanguage = null;
          try {
            var storedLanguage = window.localStorage.getItem("flowpoint-language");
            savedLanguage = supportedLanguages.find(function(code) {
              return storedLanguage && code.toLowerCase() === storedLanguage.toLowerCase();
            });
          } catch (e) {}
          if (!requestedLanguage && !cookieLanguage && savedLanguage) {
            document.cookie = "googtrans=/" + sourceLanguage + "/" + savedLanguage + "; path=/; max-age=31536000; SameSite=Lax";
            document.cookie = "googtrans=/" + sourceLanguage + "/" + savedLanguage + "; path=/; domain=" + window.location.hostname + "; max-age=31536000; SameSite=Lax";
            window.location.reload();
            return;
          }
          var language = requestedLanguage || cookieLanguage || "en";
          document.documentElement.lang = language;
          document.documentElement.dir = ["ar", "he"].includes(language.toLowerCase()) ? "rtl" : "ltr";
          document.documentElement.dataset.language = language;
          document.cookie = "googtrans=/" + sourceLanguage + "/" + language + "; path=/; max-age=31536000; SameSite=Lax";
          document.cookie = "googtrans=/" + sourceLanguage + "/" + language + "; path=/; domain=" + window.location.hostname + "; max-age=31536000; SameSite=Lax";
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var themeMode = root.dataset.theme || "system";
          if (themeMode === "system") {
            try {
              var savedTheme = window.localStorage.getItem("flowpoint-theme");
              if (savedTheme === "light" || savedTheme === "dark") {
                themeMode = savedTheme;
                root.dataset.theme = themeMode;
                document.cookie = "flowpoint-theme=" + themeMode + "; path=/; max-age=31536000; SameSite=Lax";
              }
            } catch (e) {}
          }
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedTheme = themeMode === "system" ? (systemDark ? "dark" : "light") : themeMode;
          root.classList.toggle("dark", resolvedTheme === "dark");
          root.style.colorScheme = resolvedTheme;
        } catch(e) {}
      })();
    </script>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var mode = root.dataset.theme || "system";
          var resolved = mode === "system" ? (root.classList.contains("dark") ? "dark" : "light") : mode;
          var landing = document.querySelector("#root .fp2-page");
          if (landing) landing.dataset.theme = resolved;
          document.querySelectorAll("select[data-theme-picker]").forEach(function(select) {
            select.value = mode;
          });
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        var sourceLanguage = "en";
        new google.translate.TranslateElement({
          pageLanguage: sourceLanguage,
          includedLanguages: 'en,fr,es,de,it,pt,nl,pl,ru,uk,cs,ro,hu,sv,da,no,fi,el,tr,ar,he,hi,zh-CN,zh-TW,ja,ko,th,vi,id,ms',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
  </body>
</html>
