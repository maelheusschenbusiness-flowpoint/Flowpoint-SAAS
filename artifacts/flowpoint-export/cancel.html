<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paiement annulé — FlowPoint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1120; --bg2: #111827; --surface: #1e293b;
      --border: #2d3f55; --blue: #2563eb; --blue-h: #1d4ed8;
      --text: #f1f5f9; --text-soft: #94a3b8; --text-muted: #64748b;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f8fafc; --bg2: #ffffff; --surface: #f1f5f9; --border: rgba(0,0,0,.1); --text: #0f172a; --text-soft: #475569; --text-muted: #94a3b8; }
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }
    .fp-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 18px; box-shadow: 0 8px 40px rgba(0,0,0,.4);
      padding: 52px 40px; max-width: 440px; width: 100%; text-align: center;
    }
    .fp-icon-wrap {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(100,116,139,0.1); border: 2px solid rgba(100,116,139,0.2);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 36px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--text-soft); line-height: 1.6; margin-bottom: 6px; }
    .fp-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
    .fp-btn-primary {
      display: block; padding: 13px; background: var(--blue); color: #fff;
      border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: background 0.15s;
    }
    .fp-btn-primary:hover { background: var(--blue-h); }
    .fp-btn-secondary {
      display: block; padding: 12px; background: transparent;
      color: var(--text-muted); border: 1px solid var(--border);
      border-radius: 9px; font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: border-color 0.15s, color 0.15s;
    }
    .fp-btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
  </style>
</head>
<body>
  <div class="fp-card">
    <div class="fp-icon-wrap">🛑</div>
    <h1>Paiement annulé</h1>
    <p>Votre paiement a été annulé. Aucun montant n'a été débité.</p>
    <p>Vous pouvez réessayer à tout moment ou rester sur votre plan actuel.</p>
    <div class="fp-actions">
      <a href="/pricing.html" class="fp-btn-primary">Retour aux tarifs</a>
      <a href="/login.html" class="fp-btn-secondary">Se connecter</a>
    </div>
  </div>
</body>
</html>
