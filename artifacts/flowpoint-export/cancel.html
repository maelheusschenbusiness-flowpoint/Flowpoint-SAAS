<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){var t;try{t=localStorage.getItem('fp:theme')||localStorage.getItem('fp-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;})();</script>
  <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" id="fp-meta-tc" content="#0b1120"/>
  <script src="/fp-locale.js?v=20261025"></script>
  <title>Payment canceled — FlowPoint</title>
  <link rel="stylesheet" href="/funnel-theme.css?v=20261110">
  <script src="/funnel-theme.js?v=20261110" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; gap: 20px; }

    .fp-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .fp-logo-name { font-size: 19px; font-weight: 700; color: var(--text); }
    .fp-logo-name span { color: var(--blue-light); }

    .fp-card { width: 100%; max-width: 480px; background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 44px 36px 36px; box-shadow: var(--shadow); text-align: center; }
    .fp-icon-wrap { width: 72px; height: 72px; border-radius: 50%; background: rgba(100,116,139,0.1); border: 2px solid rgba(100,116,139,0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 34px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .fp-subtitle { font-size: 14px; color: var(--text-soft); line-height: 1.6; margin-bottom: 8px; }
    .fp-notice { font-size: 12.5px; color: var(--text-muted); margin-bottom: 24px; padding: 11px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; line-height: 1.6; }

    .fp-cart-preview { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 24px; text-align: left; }
    .fp-cart-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .fp-cart-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-soft); gap: 8px; }
    .fp-cart-item:last-child { border-bottom: none; }

    .fp-actions { display: flex; flex-direction: column; gap: 10px; }
    .fp-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; transition: background .15s; }
    .fp-btn-primary { background: var(--blue); color: #fff; }
    .fp-btn-primary:hover { background: var(--blue-h); }
    .fp-btn-secondary { background: transparent; color: var(--text-soft); border: 1px solid var(--border); font-weight: 600; }
    .fp-btn-secondary:hover { border-color: var(--blue); color: var(--blue-light); }
    .fp-btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; font-size: 13px; }
    .fp-btn-ghost:hover { border-color: rgba(100,116,139,0.5); color: var(--text-soft); }

    @media (max-width: 560px) { .fp-card { padding: 32px 20px 28px; } }
  </style>
</head>
<body>

<a href="/pricing.html" class="fp-logo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34">
    <defs><linearGradient id="fp-ca-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient></defs>
    <rect width="48" height="48" rx="10" ry="10" fill="url(#fp-ca-g)"/>
    <g transform="translate(12,12)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </g>
  </svg>
  <span class="fp-logo-name">Flow<span>Point</span></span>
</a>

<div class="fp-card">
  <div class="fp-icon-wrap">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="17" stroke="rgba(100,116,139,0.35)" stroke-width="1.5"/>
      <path d="M13 13 L23 23 M23 13 L13 23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Payment canceled</h1>
  <p class="fp-subtitle">You canceled the checkout. Your free trial has not started yet.</p>
  <p class="fp-notice">No subscription was confirmed and you have not been charged.</p>

  <div class="fp-cart-preview" id="fp-cart-preview" style="display:none">
    <div class="fp-cart-title">Your selection has been saved</div>
    <div id="fp-cart-items"></div>
  </div>

  <div class="fp-actions">
    <a href="/checkout.html" class="fp-btn fp-btn-primary" id="fp-resume-btn">
      Resume my free trial →
    </a>
    <a href="/pricing.html" class="fp-btn fp-btn-secondary">
      ← Edit my cart
    </a>
    <a href="/pricing.html" class="fp-btn fp-btn-ghost">
      Back to pricing
    </a>
  </div>
</div>

<script>
(function () {
  'use strict';

  var PLAN_NAMES = { standard: 'Standard plan', pro: 'Pro plan', ultra: 'Ultra plan' };
  var ADDON_NAMES = {
    monitorsPack10: '+10 Monitors',
    monitorsPack50: '+50 Monitors',
    globalMonitoring: 'Global Monitoring', slaMonitoring: 'Advanced SLA Monitoring',
    advancedSeoLab: 'Advanced SEO Lab', keywordDomination: 'Keyword Domination Engine',
    backlinkIntelligence: 'Backlink Intelligence', aiContentStrategist: 'AI Content Strategist',
    gbpSlots10: '+10 GBP Locations', aiGbpPosting: 'AI GBP Posting',
    reviewIntelligence: 'Review Intelligence', localDominationMaps: 'Local Domination Maps',
    aiCro: 'AI CRO Strategist', behavioralAI: 'Behavioral AI',
    revenueLeak: 'Revenue Leak AI', abTestingAI: 'AI A/B Testing',
    whiteLabel: 'White-Label Exports', agencyPacks: 'Agency Reporting Packs',
    aiExecutiveReport: 'AI Executive Reporting', aiForecasting: 'AI Forecasting Engine',
    marketIntelligence: 'AI Market Intelligence', aiWorkflows: 'AI Automation Workflows',
    extraSeats: '+5 Seats', enterprisePermissions: 'Enterprise Permissions',
    retention90d: '90-day retention', retention365d: '365-day retention',
    advancedWebhooks: 'Advanced Webhooks', zapierIntegration: 'Zapier / Make',
    crmIntegration: 'CRM Integration', customDomain: 'Custom Domain',
    ssoEnterprise: 'SSO Enterprise', aiWorkspaceLaunch: 'AI Workspace Launch',
    prioritySupport: 'Priority Support',
    auditsPack200: '+200 audits pack', auditsPack1000: '+1,000 audits pack',
    pdfPack200: '+200 PDF pack', exportsPack1000: '+1,000 exports pack',
    aiCreditsPack50k: '+50,000 AI credits', aiCreditsPack200k: '+200,000 AI credits',
    aiCreditsPack500k: '+500,000 AI credits'
  };

  var cart = null;
  try { cart = JSON.parse(localStorage.getItem('fp_cart') || 'null'); } catch(e) {}

  /* Fallback URL params */
  if (!cart || (!cart.plan && !Object.keys(cart.addons || {}).length)) {
    var params = new URLSearchParams(window.location.search);
    var planParam = params.get('plan');
    if (planParam && PLAN_NAMES[planParam.toLowerCase()]) {
      cart = { plan: planParam.toLowerCase(), addons: {} };
    }
  }

  if (cart && (cart.plan || Object.keys(cart.addons || {}).length)) {
    var previewEl = document.getElementById('fp-cart-preview');
    var itemsEl   = document.getElementById('fp-cart-items');
    var html = '';

    if (cart.plan && PLAN_NAMES[cart.plan]) {
      html += '<div class="fp-cart-item"><span>' + PLAN_NAMES[cart.plan] + ' — 14-day free trial</span><span style="color:var(--text-muted);font-size:12px">€0 for 14 days</span></div>';
    }
    Object.keys(cart.addons || {}).forEach(function (id) {
      var qty = cart.addons[id];
      html += '<div class="fp-cart-item"><span>' + (ADDON_NAMES[id] || id) + (qty > 1 ? ' × ' + qty : '') + '</span></div>';
    });

    if (html) { itemsEl.innerHTML = html; previewEl.style.display = 'block'; }
  }

})();
</script>
</body>
</html>
