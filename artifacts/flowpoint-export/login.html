<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="fp-meta-tc" name="theme-color" content="#f8faff"/>
  <title>Connexion — FlowPoint</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('fp-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('fp-meta-tc').content = t === 'dark' ? '#050810' : '#f8faff';
      } catch(e){}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fp-bg: #f8faff;
      --fp-surface: #ffffff;
      --fp-border: rgba(0,0,0,0.08);
      --fp-text: #0f172a;
      --fp-text-muted: #64748b;
      --fp-accent: #2563eb;
      --fp-accent-hover: #1d4ed8;
      --fp-radius: 12px;
      --fp-shadow: 0 4px 24px rgba(37,99,235,0.08), 0 1px 3px rgba(0,0,0,0.06);
    }
    html[data-theme="dark"] {
      --fp-bg: #050810;
      --fp-surface: #0d1117;
      --fp-border: rgba(255,255,255,0.08);
      --fp-text: #f1f5f9;
      --fp-text-muted: #94a3b8;
      --fp-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--fp-bg);
      color: var(--fp-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .fp-login-wrap {
      width: 100%;
      max-width: 420px;
    }

    .fp-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .fp-logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .fp-logo-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .fp-card {
      background: var(--fp-surface);
      border: 1px solid var(--fp-border);
      border-radius: var(--fp-radius);
      box-shadow: var(--fp-shadow);
      padding: 36px 32px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }
    .fp-subtitle {
      font-size: 14px;
      color: var(--fp-text-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .fp-form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--fp-text-muted);
    }
    input[type="email"] {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid var(--fp-border);
      border-radius: 8px;
      background: var(--fp-bg);
      color: var(--fp-text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="email"]:focus {
      border-color: var(--fp-accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .fp-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .fp-btn:active { transform: scale(0.98); }
    .fp-btn-primary {
      background: var(--fp-accent);
      color: #fff;
    }
    .fp-btn-primary:hover { background: var(--fp-accent-hover); }
    .fp-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .fp-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--fp-text-muted);
      font-size: 12px;
    }
    .fp-divider::before, .fp-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--fp-border);
    }

    .fp-btn-google {
      background: var(--fp-surface);
      color: var(--fp-text);
      border: 1px solid var(--fp-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .fp-btn-google:hover { background: var(--fp-bg); }

    .fp-google-icon {
      width: 18px; height: 18px;
    }

    .fp-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .fp-alert-success {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: #059669;
    }
    html[data-theme="dark"] .fp-alert-success { color: #34d399; }
    .fp-alert-error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #dc2626;
    }
    html[data-theme="dark"] .fp-alert-error { color: #f87171; }

    .fp-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--fp-text-muted);
    }
    .fp-footer a { color: var(--fp-accent); text-decoration: none; }
    .fp-footer a:hover { text-decoration: underline; }

    .fp-spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fp-theme-toggle {
      position: fixed;
      top: 16px; right: 16px;
      background: var(--fp-surface);
      border: 1px solid var(--fp-border);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 16px;
      color: var(--fp-text-muted);
    }
  </style>
</head>
<body>
  <button class="fp-theme-toggle" id="fp-theme-btn" title="Changer de thème">🌙</button>

  <div class="fp-login-wrap">
    <div class="fp-logo">
      <div class="fp-logo-icon">⚡</div>
      <span class="fp-logo-name">FlowPoint</span>
    </div>

    <div class="fp-card">
      <h1>Bienvenue</h1>
      <p class="fp-subtitle">Connectez-vous à votre espace FlowPoint</p>

      <div class="fp-alert fp-alert-success" id="fp-success"></div>
      <div class="fp-alert fp-alert-error" id="fp-error"></div>

      <form id="fp-login-form">
        <div class="fp-form-group">
          <label for="fp-email">Adresse e-mail</label>
          <input type="email" id="fp-email" name="email" placeholder="vous@exemple.com" required autocomplete="email" autofocus/>
        </div>
        <button type="submit" class="fp-btn fp-btn-primary" id="fp-submit-btn">
          Recevoir le lien de connexion
        </button>
      </form>

      <div class="fp-divider">ou</div>

      <button class="fp-btn fp-btn-google" id="fp-google-btn">
        <svg class="fp-google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuer avec Google
      </button>
    </div>

    <div class="fp-footer">
      En vous connectant, vous acceptez nos
      <a href="https://flowpoint.pro/legal/terms" target="_blank">Conditions d'utilisation</a>
      et notre <a href="https://flowpoint.pro/legal/privacy" target="_blank">Politique de confidentialité</a>.
    </div>
  </div>

  <script src="fp-config.js"></script>
  <script>
    (function () {
      'use strict';

      var form     = document.getElementById('fp-login-form');
      var emailIn  = document.getElementById('fp-email');
      var submitBtn = document.getElementById('fp-submit-btn');
      var successEl = document.getElementById('fp-success');
      var errorEl   = document.getElementById('fp-error');
      var googleBtn = document.getElementById('fp-google-btn');
      var themeBtn  = document.getElementById('fp-theme-btn');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
      }
      function showSuccess(msg) {
        successEl.textContent = msg;
        successEl.style.display = 'block';
        errorEl.style.display = 'none';
      }
      function clearAlerts() {
        errorEl.style.display = 'none';
        successEl.style.display = 'none';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.innerHTML = loading
          ? '<span class="fp-spinner"></span>Envoi en cours…'
          : 'Recevoir le lien de connexion';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearAlerts();
        var email = emailIn.value.trim();
        if (!email) { showError('Veuillez saisir votre adresse e-mail.'); return; }

        setLoading(true);
        fetch('/api/auth/login-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: email })
        })
        .then(function (res) { return res.json().then(function(d){ return { ok: res.ok, data: d }; }); })
        .then(function (r) {
          setLoading(false);
          if (r.ok) {
            form.style.display = 'none';
            showSuccess('✉️ Un lien de connexion a été envoyé à ' + email + '. Vérifiez votre boîte de réception (et les spams).');
            if (r.data.debugLink) {
              showSuccess('🔧 Mode debug — Lien direct : ' + r.data.debugLink);
            }
          } else {
            showError(r.data.error || 'Une erreur est survenue. Réessayez.');
          }
        })
        .catch(function () {
          setLoading(false);
          showError('Impossible de contacter le serveur. Vérifiez votre connexion.');
        });
      });

      googleBtn.addEventListener('click', function () {
        window.location.href = '/api/auth/google/login';
      });

      themeBtn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        try { localStorage.setItem('fp-theme', next); } catch(e){}
      });

      (function initThemeBtn() {
        var t = document.documentElement.getAttribute('data-theme') || 'light';
        themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
      })();
    })();
  </script>
</body>
</html>
