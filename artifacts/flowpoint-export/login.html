<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — FlowPoint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fp-bg: #f1f5f9;
      --fp-surface: #ffffff;
      --fp-border: rgba(0,0,0,0.09);
      --fp-text: #0f172a;
      --fp-text-muted: #64748b;
      --fp-accent: #2563eb;
      --fp-accent-hover: #1d4ed8;
      --fp-radius: 14px;
      --fp-shadow: 0 8px 32px rgba(37,99,235,0.10), 0 1px 4px rgba(0,0,0,0.07);
      --fp-btn-bg: #f8faff;
      --fp-btn-hover: #eef3ff;
      --fp-input-bg: #f8faff;
      --fp-divider: rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fp-bg: #050810;
        --fp-surface: #0d1117;
        --fp-border: rgba(255,255,255,0.08);
        --fp-text: #f1f5f9;
        --fp-text-muted: #94a3b8;
        --fp-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.4);
        --fp-btn-bg: #161b22;
        --fp-btn-hover: #1e2631;
        --fp-input-bg: #0d1117;
        --fp-divider: rgba(255,255,255,0.08);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--fp-bg);
      color: var(--fp-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .fp-login-wrap { width: 100%; max-width: 420px; }

    .fp-logo {
      display: flex;
      align-items: center;
      gap: 11px;
      justify-content: center;
      margin-bottom: 32px;
      text-decoration: none;
    }
    .fp-logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--fp-text);
    }

    .fp-card {
      background: var(--fp-surface);
      border: 1px solid var(--fp-border);
      border-radius: var(--fp-radius);
      box-shadow: var(--fp-shadow);
      padding: 36px 32px 32px;
    }

    h1 { font-size: 21px; font-weight: 700; margin-bottom: 6px; text-align: center; }
    .fp-subtitle { font-size: 14px; color: var(--fp-text-muted); text-align: center; margin-bottom: 28px; }

    .fp-form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--fp-text-muted); }
    input[type="email"] {
      width: 100%; padding: 11px 14px; font-size: 14px;
      border: 1px solid var(--fp-border); border-radius: 8px;
      background: var(--fp-input-bg); color: var(--fp-text);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="email"]:focus { border-color: var(--fp-accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.14); }
    input[type="email"]::placeholder { color: var(--fp-text-muted); opacity: 0.6; }

    .fp-btn {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 9px;
    }
    .fp-btn:active { transform: scale(0.98); }
    .fp-btn + .fp-btn { margin-top: 10px; }

    .fp-btn-primary { background: var(--fp-accent); color: #fff; }
    .fp-btn-primary:hover { background: var(--fp-accent-hover); }
    .fp-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .fp-btn-oauth { background: var(--fp-btn-bg); color: var(--fp-text); border: 1px solid var(--fp-border); }
    .fp-btn-oauth:hover { background: var(--fp-btn-hover); }

    .fp-btn-apple { background: #000; color: #fff; border: 1px solid #000; }
    .fp-btn-apple:hover { background: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .fp-btn-apple { background: #fff; color: #000; border: 1px solid #fff; }
      .fp-btn-apple:hover { background: #f0f0f0; }
    }

    .fp-oauth-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .fp-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: var(--fp-text-muted); font-size: 12px;
    }
    .fp-divider::before, .fp-divider::after { content: ''; flex: 1; border-top: 1px solid var(--fp-divider); }

    .fp-alert {
      display: none; padding: 12px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; line-height: 1.55;
    }
    .fp-alert-success { background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.25); color: #059669; }
    .fp-alert-error   { background: rgba(239,68,68,0.10);  border: 1px solid rgba(239,68,68,0.25);  color: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .fp-alert-success { color: #34d399; }
      .fp-alert-error   { color: #f87171; }
    }

    .fp-footer { margin-top: 22px; text-align: center; font-size: 12px; color: var(--fp-text-muted); line-height: 1.6; }
    .fp-footer a { color: var(--fp-text-muted); text-decoration: underline; text-underline-offset: 2px; }
    .fp-footer a:hover { color: var(--fp-text); }

    .fp-spinner {
      display: inline-block; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fp-hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="fp-login-wrap">

    <a class="fp-logo" href="https://flowpoint.pro/" target="_blank" rel="noopener noreferrer" aria-label="FlowPoint">
      <img src="/assets/flowpoint-logo.svg" width="40" height="40" alt="FlowPoint" style="flex-shrink:0"/>
      <span class="fp-logo-name">FlowPoint</span>
    </a>

    <div class="fp-card">
      <h1>Bienvenue</h1>
      <p class="fp-subtitle">Connectez-vous à votre espace FlowPoint</p>

      <div class="fp-alert fp-alert-success" id="fp-success"></div>
      <div class="fp-alert fp-alert-error"   id="fp-error"></div>

      <form id="fp-login-form">
        <div class="fp-form-group">
          <label for="fp-email">Adresse e-mail</label>
          <input type="email" id="fp-email" name="email"
                 placeholder="vous@exemple.com"
                 required autocomplete="email" autofocus/>
        </div>
        <button type="submit" class="fp-btn fp-btn-primary" id="fp-submit-btn">
          Recevoir le lien de connexion
        </button>
      </form>

      <div class="fp-divider" id="fp-oauth-divider">ou</div>

      <div id="fp-oauth-btns">
        <button class="fp-btn fp-btn-oauth fp-hidden" id="fp-google-btn" data-loginurl="/api/auth/google/login">
          <svg class="fp-oauth-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuer avec Google
        </button>

        <button class="fp-btn fp-btn-apple fp-hidden" id="fp-apple-btn" data-loginurl="/api/auth/apple/login">
          <svg class="fp-oauth-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98l-.09.06c-.22.15-2.19 1.28-2.17 3.82.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.36 2.75M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/>
          </svg>
          Continuer avec Apple
        </button>

        <button class="fp-btn fp-btn-oauth fp-hidden" id="fp-github-btn" data-loginurl="/api/auth/github/login">
          <svg class="fp-oauth-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.744.084-.729.084-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605-2.665-.3-5.467-1.332-5.467-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          Continuer avec GitHub
        </button>
      </div>

    </div>

    <div class="fp-footer">
      En vous connectant, vous acceptez nos
      <a href="https://flowpoint.pro/informations-legales" target="_blank" rel="noopener noreferrer">Conditions d'utilisation</a>
      et notre <a href="https://flowpoint.pro/informations-legales" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>.
    </div>

  </div>

  <script src="fp-config.js"></script>
  <script>
  (function () {
    'use strict';

    var form      = document.getElementById('fp-login-form');
    var emailIn   = document.getElementById('fp-email');
    var submitBtn = document.getElementById('fp-submit-btn');
    var successEl = document.getElementById('fp-success');
    var errorEl   = document.getElementById('fp-error');
    var oauthDiv  = document.getElementById('fp-oauth-divider');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
    }
    function showSuccess(msg) {
      successEl.textContent = msg;
      successEl.style.display = 'block';
      errorEl.style.display = 'none';
    }
    function clearAlerts() {
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
    }
    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitBtn.innerHTML = loading
        ? '<span class="fp-spinner"></span>Envoi\u2026'
        : 'Recevoir le lien de connexion';
    }

    /* ── Show ?error= from OAuth callback ── */
    (function () {
      var p = new URLSearchParams(window.location.search);
      var e = p.get('error');
      if (!e) return;
      var msgs = {
        google_auth_failed : '\u00C9chec Google. R\u00E9essayez.',
        missing_code       : 'Connexion annul\u00E9e.',
        access_denied      : 'Acc\u00E8s refus\u00E9.',
      };
      showError(msgs[e] || 'Erreur : ' + e.replace(/_/g, ' ') + '.');
    })();

    /* ── Magic link form ── */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearAlerts();
      var email = emailIn.value.trim();
      if (!email) { showError('Veuillez saisir votre adresse e-mail.'); return; }

      setLoading(true);
      fetch('/api/auth/login-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: email })
      })
      .then(function (res) {
        return res.json().then(function (d) { return { ok: res.ok, status: res.status, data: d }; });
      })
      .then(function (r) {
        setLoading(false);
        if (r.ok) {
          form.style.display = 'none';
          showSuccess('\u2709\uFE0F Lien envoy\u00E9 \u00E0 ' + email + '. V\u00E9rifiez votre bo\u00EEte mail (et les spams).');
        } else if (r.status === 503) {
          showError('Service e-mail indisponible. Connectez-vous avec Google.');
        } else {
          showError(r.data.error || 'Une erreur est survenue. Veuillez r\u00E9essayer.');
        }
      })
      .catch(function () {
        setLoading(false);
        showError('Impossible de contacter le serveur. V\u00E9rifiez votre connexion.');
      });
    });

    /* ── OAuth buttons ── */
    document.getElementById('fp-oauth-btns').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-loginurl]');
      if (btn) window.location.href = btn.getAttribute('data-loginurl');
    });

    /* ── Load providers → show configured buttons only ── */
    fetch('/api/auth/providers', { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var order = ['google', 'apple', 'github'];
        var hasOAuth = false;
        order.forEach(function (id) {
          var p = (data.providers || []).find(function (x) { return x.id === id; });
          if (p && p.configured) {
            var btn = document.getElementById('fp-' + id + '-btn');
            if (btn) { btn.classList.remove('fp-hidden'); hasOAuth = true; }
          }
        });
        if (!hasOAuth) oauthDiv.style.display = 'none';
      })
      .catch(function () { oauthDiv.style.display = 'none'; });

  })();
  </script>
</body>
</html>
