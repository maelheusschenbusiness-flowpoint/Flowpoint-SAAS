<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){var t;try{t=localStorage.getItem('fp:theme')||localStorage.getItem('fp-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;})();</script>
  <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">

  <meta name="robots" content="noindex, nofollow"/>
  <title>Payment — FlowPoint</title>
  <script>
    /* Diagnostic du chargement de Stripe.js : on enregistre la cause AVANT de choisir un message
       (CSP, réseau/blocage). Un bloqueur n'est jamais supposé par défaut. */
    window.__fpStripeLoad = { error: false, csp: false };
    document.addEventListener('securitypolicyviolation', function (e) {
      if (String(e.blockedURI || '').indexOf('stripe.com') >= 0) window.__fpStripeLoad.csp = true;
    });
  </script>
  <script src="/fp-locale.js?v=20261030"></script>
  <script src="/funnel-theme.js?v=20261110" defer></script>
  <script src="https://js.stripe.com/v3/" onerror="window.__fpStripeLoad.error = true"></script>
  <link rel="stylesheet" href="/funnel-theme.css?v=20261110">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Tokens: /funnel-theme.css. Page-only aliases below. */
    :root { --radius: 16px; --green-brd: var(--green-border); --amber: #fbbf24; --amber-bg: rgba(234,179,8,.08); --amber-border: rgba(234,179,8,.25); }
    html[data-theme="light"] { --amber: #92400e; --amber-bg: rgba(217,119,6,.08); --amber-border: rgba(217,119,6,.3); }
    html[data-theme="dark"] .fp-card { background: rgba(8,14,30,0.94); border-color: rgba(255,255,255,0.07); }

    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px; line-height: 1.5;
    }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 32px 16px 64px; }

    /* ── Logo ── */
    .fp-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 28px; }
    .fp-logo-name { font-size: 20px; font-weight: 800; letter-spacing: -.4px; color: var(--text); }
    .fp-logo-name span { color: var(--blue-light); }

    /* ── Steps ── */
    .fp-steps { display: flex; align-items: center; gap: 0; margin-bottom: 28px; font-size: 12px; font-weight: 600; }
    .fp-step { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    .fp-step.active { color: var(--blue-light); }
    .fp-step.done { color: var(--green); }
    .fp-step-num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .fp-step.done .fp-step-num { background: var(--green-bg); border-color: var(--green-brd); }
    .fp-step.active .fp-step-num { background: rgba(37,99,235,0.12); border-color: rgba(37,99,235,0.4); }
    .fp-step-sep { width: 28px; height: 1.5px; background: var(--border); margin: 0 8px; flex-shrink: 0; }

    /* ── Wrap ── */
    .fp-wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }

    /* ── Cards ── */
    .fp-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 22px 24px;
    }
    .fp-card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 14px; }

    /* ── Summary rows ── */
    .fp-sum-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 7px 0; }
    .fp-sum-row + .fp-sum-row { border-top: 1px solid rgba(255,255,255,0.05); }
    html[data-theme="light"] .fp-sum-row + .fp-sum-row { border-top-color: rgba(0,0,0,0.05); }
    .fp-sum-label { font-size: 13.5px; color: var(--text-soft); flex: 1; min-width: 0; }
    .fp-sum-badge { display: inline-block; font-size: 9.5px; font-weight: 700; border-radius: 20px; padding: 1.5px 6px; vertical-align: middle; white-space: nowrap; margin-left: 6px; }
    .fp-badge-trial { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-brd); }
    .fp-badge-now   { background: rgba(37,99,235,0.1); color: var(--blue-light); border: 1px solid rgba(37,99,235,0.2); }
    .fp-badge-incl  { background: rgba(100,116,139,0.1); color: var(--text-muted); border: 1px solid rgba(100,116,139,0.2); }
    .fp-sum-amount  { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; text-align: right; }
    .fp-sum-amount.muted { color: var(--text-muted); font-weight: 400; }

    /* ── Totals ── */
    .fp-divider { height: 1px; background: var(--border); margin: 10px 0; }
    .fp-total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
    .fp-total-lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .fp-total-val { font-size: 20px; font-weight: 800; color: var(--blue-light); }
    .fp-total-val.after { font-size: 15px; color: var(--green); }
    .fp-total-unit { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 1px; }

    /* ── Stripe elements ── */
    #fp-payment-element { margin-bottom: 18px; }

    /* ── Alert ── */
    .fp-alert { display: none; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .fp-alert.show { display: block; }
    .fp-alert-error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }

    /* ── Buttons ── */
    .fp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 20px; border: none; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s, opacity .15s; text-decoration: none; }
    .fp-btn-primary { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: #fff; box-shadow: 0 4px 16px rgba(37,99,235,.3); margin-bottom: 10px; }
    .fp-btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); }
    .fp-btn-primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .fp-btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 13px; font-weight: 500; padding: 11px; }
    .fp-btn-ghost:hover { border-color: var(--blue); color: var(--blue-light); }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .fp-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; flex-shrink: 0; }

    /* ── Loading state ── */
    .fp-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 0; text-align: center; }
    .fp-loading-spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--blue-light); animation: spin .7s linear infinite; }
    .fp-loading p { font-size: 14px; color: var(--text-muted); }

    /* ── Security + trial notes ── */
    .fp-secure-note { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
    .fp-trial-note { text-align: center; font-size: 12.5px; color: var(--green); background: var(--green-bg); border: 1px solid var(--green-brd); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
  </style>
</head>

<!-- Logo -->
<a href="/checkout.html" class="fp-logo">
  <img src="/assets/flowpoint-logo.svg" width="34" height="34" alt="FlowPoint" aria-hidden="true" style="display:block">
  <span class="fp-logo-name">Flow<span>Point</span></span>
</a>

<!-- Steps -->
<div class="fp-steps">
  <div class="fp-step done"><div class="fp-step-num">✓</div><span>Plans</span></div>
  <div class="fp-step-sep"></div>
  <div class="fp-step done"><div class="fp-step-num">✓</div><span>Summary</span></div>
  <div class="fp-step-sep"></div>
  <div class="fp-step active"><div class="fp-step-num">3</div><span>Payment</span></div>
</div>

<!-- Wrap -->
<div class="fp-wrap">

  <!-- Order Summary -->
  <div class="fp-card" id="fp-summary-card">
    <div class="fp-loading"><div class="fp-loading-spinner"></div><p>Loading…</p></div>
  </div>

  <!-- Payment + Address -->
  <div class="fp-card" id="fp-payment-card">

    <!-- Payment Element -->
    <div class="fp-card-title">Card details</div>
    <div id="fp-trial-note" class="fp-trial-note" style="display:none"></div>
    <div class="fp-alert fp-alert-error" id="fp-alert"></div>
    <div id="fp-payment-element" role="group" aria-label="Card details"></div>

    <span id="fp-pay-desc" hidden>Confirms your FlowPoint subscription. A card is required; payments are secured by Stripe.</span>
    <button class="fp-btn fp-btn-primary" id="fp-pay-btn" disabled aria-label="Confirm and start" aria-describedby="fp-pay-desc">
      <span id="fp-btn-text">Loading…</span>
      <span class="fp-spinner" id="fp-spinner" style="display:none"></span>
    </button>
    <a href="/checkout.html" class="fp-btn fp-btn-ghost">← Back to summary</a>
    <p class="fp-secure-note">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure payment · TLS · your card details never touch our servers
    </p>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────────────────────────────────
     SOURCE UNIQUE DES PRIX : le devis serveur.
     Cette page ne contient aucun catalogue, aucun prix et aucune matrice
     d'inclusion. Le panier ne transporte qu'une SÉLECTION (plan + add-ons) ;
     tous les montants affichés proviennent de `quote`, qui est exactement
     l'objet ayant servi à créer l'intent Stripe.
     ────────────────────────────────────────────────────────────────────── */

  /* ── Panier : sélection uniquement ── */
  var cart = null;
  try { cart = JSON.parse(localStorage.getItem('fp_cart') || 'null'); } catch (e) {}
  if (!cart || (!cart.plan && !Object.keys(cart.addons || {}).length)) {
    window.location.href = '/checkout.html';
    return;
  }
  var plan   = cart.plan || '';
  var addons = cart.addons || {};

  /* ── État ── */
  var quote         = null;   /* devis serveur — seule source de montants */
  var stripe, elements;
  var _paymentReady = false;
  var _payBtnLabel  = 'Confirm →';
  var _mode         = 'setup';
  function authHeaders() {
    try {
      var token = sessionStorage.getItem('fp_session_token') || '';
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    } catch (e) { return {}; }
  }
  function preRegisterToken() {
    try {
      var token = sessionStorage.getItem('fp_pre_reg_token') || '';
      if (token) return token;
      var stored = JSON.parse(localStorage.getItem('fp_pre_reg_token') || 'null');
      return stored && stored.token && stored.exp > Date.now() ? stored.token : '';
    } catch (e) { return ''; }
  }
  function rememberCheckoutIntent() {
    try {
      localStorage.setItem('flowpoint_pending_checkout', JSON.stringify({
        cart: cart,
        sellerRef: localStorage.getItem('fp_seller_ref') || '',
        next: '/checkout-payment.html',
        exp: Date.now() + 1800000
      }));
      sessionStorage.setItem('fp_next', '/checkout-payment.html');
    } catch (e) {}
  }
  async function requireAuthenticatedCheckout() {
    // A signup token from this browser (seller link / signup) is the identity for
    // this checkout, even if an older FlowPoint session is still open here. It is
    // kept, never dropped because /api/me answers: the server checks it (unexpired,
    // unconsumed) and only falls back to the session when it is not valid.
    if (preRegisterToken()) return true;
    var resp = null;
    try {
      resp = await fetch('/api/me', {
        credentials: 'include',
        headers: Object.assign({ 'Cache-Control': 'no-cache' }, authHeaders())
      });
    } catch (e) {}
    if (resp && resp.ok) return true;
    rememberCheckoutIntent();
    window.location.replace('/signin.html?next=' + encodeURIComponent('/checkout.html'));
    return false;
  }

  /* ── Helpers ── */
  function eur(minor) {
    var v = (Number(minor) || 0) / 100;
    return '€' + (v % 1 === 0 ? String(v) : v.toFixed(2));
  }
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showAlert(msg, withRetry) {
    var el = document.getElementById('fp-alert');
    el.textContent = msg;
    if (withRetry) {
      var b = document.createElement('button');
      b.type = 'button';
      b.id = 'fp-retry-load';
      b.className = 'fp-btn fp-btn-ghost';
      b.style.marginTop = '10px';
      b.textContent = 'Try again';
      b.addEventListener('click', function () { window.location.reload(); });
      el.appendChild(document.createElement('br'));
      el.appendChild(b);
    }
    el.classList.add('show');
  }
  /* Message adapté à la cause réelle de l'échec de chargement de Stripe.js. */
  function stripeLoadMessage() {
    var st = window.__fpStripeLoad || {};
    if (st.csp) {
      return ('The browser blocked the Stripe payment module (site security policy). Try again; if the problem persists, contact support.');
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      return ('You appear to be offline: the Stripe payment module could not be loaded. Check your Internet connection, then try again.');
    }
    return ('The Stripe payment module could not be loaded (unstable network, firewall, browser extension or temporary outage). Try again; if the problem persists, try another network or temporarily disable your extensions.');
  }
  function hideAlert() { document.getElementById('fp-alert').classList.remove('show'); }
  function setLoading(on, label) {
    var btn  = document.getElementById('fp-pay-btn');
    var txt  = document.getElementById('fp-btn-text');
    var spin = document.getElementById('fp-spinner');
    btn.disabled = on;
    spin.style.display = on ? 'inline-block' : 'none';
    if (label) txt.textContent = label;
  }
  /* Libellé du bouton final : essai (rien débité aujourd'hui) vs paiement immédiat. */
  function submitLabel() {
    var immediate = quote ? (Number(quote.amountDueTodayMinor) || 0) : 0;
    if (_mode !== 'payment' && immediate === 0) return 'Start my free trial';
    return 'Pay ' + eur(quote ? (immediate || quote.totalMinor) : 0) + ' and subscribe';
  }
  function _tryEnablePayBtn() {
    if (_paymentReady) {
      document.getElementById('fp-btn-text').textContent = _payBtnLabel;
      document.getElementById('fp-pay-btn').disabled = false;
    }
  }

  /* ── Récapitulatif rendu exclusivement depuis le devis serveur ── */
  function renderSummaryLoading() {
    document.getElementById('fp-summary-card').innerHTML =
      '<div class="fp-card-title">Summary</div>' +
      '<div class="fp-sum-row"><span class="fp-sum-label muted">Calculating the amount…</span></div>';
  }

  function renderSummary(q) {
    var html = '<div class="fp-card-title">Summary</div>';

    (q.lines || []).forEach(function (line) {
      var label = escHtml(line.name) + (line.quantity > 1 ? ' ×' + line.quantity : '');
      var badge, amount;

      if (line.includedInPlan) {
        badge  = '<span class="fp-sum-badge fp-badge-incl">Included</span>';
        amount = '<span class="fp-sum-amount muted">€0</span>';
      } else if (line.kind === 'plan') {
        badge = q.trialEligible && q.trialDays > 0
          ? '<span class="fp-sum-badge fp-badge-trial">' + q.trialDays + ' days free</span>'
          : '';
        amount = '<span class="fp-sum-amount">' + eur(line.amountMinor) + '/month</span>';
      } else if (line.interval === 'one_time') {
        badge  = '<span class="fp-sum-badge fp-badge-now">Today</span>';
        amount = '<span class="fp-sum-amount">' + eur(line.amountMinor) + '</span>';
      } else {
        badge = line.billedToday
          ? '<span class="fp-sum-badge fp-badge-now">Today · monthly</span>'
          : '<span class="fp-sum-badge fp-badge-trial">After trial · monthly</span>';
        amount = '<span class="fp-sum-amount">' + eur(line.amountMinor) + '/month</span>';
      }

      html += '<div class="fp-sum-row"><span class="fp-sum-label">' + label + badge + '</span>' + amount + '</div>';
    });

    html += '<div class="fp-divider"></div>';
    html += '<div class="fp-total-row"><span class="fp-total-lbl">Due today</span>' +
            '<span class="fp-total-val">' + eur(q.amountDueTodayMinor) + '</span></div>';

    if (q.plan && q.recurringAmountMinor > 0) {
      html += '<div class="fp-total-row"><span class="fp-total-lbl">' +
              (q.trialEligible && q.trialDays > 0 ? 'Monthly after trial' : 'Monthly') +
              '</span><span class="fp-total-val after">' + eur(q.recurringAmountMinor) +
              '<span class="fp-total-unit">/month</span></span></div>';
    }

    document.getElementById('fp-summary-card').innerHTML = html;
  }

  function renderTrialNote(q) {
    if (!q.plan || !q.trialEligible || !q.trialDays) return;
    var noteEl = document.getElementById('fp-trial-note');
    if (!noteEl) return;
    var daysLabel = q.trialDays === 1 ? '1\u00a0day' : q.trialDays + '\u00a0days';
    var planLine = (q.lines || []).filter(function (l) { return l.kind === 'plan'; })[0];
    var after = planLine ? 'Then ' + eur(planLine.amountMinor) + '/month after your ' + q.trialDays + '-day trial. ' : 'Your subscription is charged after ' + daysLabel + '. ';
    noteEl.textContent = (q.amountDueTodayMinor === 0
      ? '€0 today · Card required. '
      : 'Add-ons billed today (' + eur(q.amountDueTodayMinor) + ') · Card required. ') +
      after + 'Cancel anytime before to avoid being charged.';
    noteEl.style.display = 'block';
  }

  /* ── Init Stripe : un seul appel renvoie l'intent ET le devis ── */
  function fpFunnelAttribution() {
    try {
      var consented = document.cookie.split(';').some(function (cookie) {
        return cookie.trim() === 'fp_analytics_consent=accepted';
      });
      if (!consented) return {};

      var visitorId = localStorage.getItem('fp_vid') || '';
      var validVisitorId =
        /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(visitorId) ||
        /^fp-[a-z0-9]+-[a-z0-9]+$/i.test(visitorId);
      var source = localStorage.getItem('fp_source') || '';
      var validSource = ['smartlead', 'google', 'direct', 'social', 'other_campaign'].indexOf(source) !== -1;
      if (!validVisitorId) return {};
      return {
        visiteurId: visitorId,
        source: validSource ? source : undefined,
      };
    } catch (e) { return {}; }
  }

  /* Apparence Stripe dérivée du thème courant (html[data-theme]). */
  function stripeAppearance() {
    var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    return {
      theme: isDark ? 'night' : 'stripe',
      variables: {
        colorPrimary:       '#2563eb',
        colorBackground:    isDark ? '#111827' : '#ffffff',
        colorText:          isDark ? '#f1f5f9' : '#0f172a',
        colorTextSecondary: isDark ? '#94a3b8' : '#475569',
        colorDanger:        isDark ? '#f87171' : '#b91c1c',
        borderRadius:       '10px',
        fontFamily:         '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Helvetica, Arial',
        fontSizeBase:       '14px',
      },
      rules: {
        '.Input': { border: isDark ? '1px solid rgba(255,255,255,0.12)' : '1px solid rgba(0,0,0,0.15)', padding: '12px 14px' },
        '.Input:focus': { border: '1px solid #2563eb', boxShadow: '0 0 0 3px rgba(37,99,235,0.15)' },
        '.Label': { marginBottom: '6px', fontWeight: '600', fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.05em' },
      }
    };
  }
  /* Changement de thème (bascule manuelle ou système) : on met à jour l'Element en place. */
  try {
    new MutationObserver(function () {
      if (elements && typeof elements.update === 'function') {
        try { elements.update({ appearance: stripeAppearance() }); } catch (e) {}
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}

  function stripeLocaleFor() {
    try { return window.fpResolveLanguage && window.fpResolveLanguage() === 'fr' ? 'fr' : 'en'; }
    catch (e) { return 'en'; }
  }
  async function initStripe() {
    renderSummaryLoading();

    var preRegToken = '';
    try { preRegToken = sessionStorage.getItem('fp_pre_reg_token') || ''; } catch (e) {}
    // Fallback: localStorage (written by signin.html with 2h TTL) survives tab closure
    if (!preRegToken) {
      try {
        var _stored = JSON.parse(localStorage.getItem('fp_pre_reg_token') || 'null');
        if (_stored && _stored.token && typeof _stored.exp === 'number' && _stored.exp > Date.now()) {
          preRegToken = _stored.token;
        }
      } catch(e) {}
    }

    /* La durée d'essai n'est PAS envoyée : le serveur seul en décide. */
    var funnelAttribution = fpFunnelAttribution();
    var resp = await fetch('/api/public/payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        plan:             plan,
        addons:           addons,
        preRegisterToken: preRegToken,
        billingAddress:   null,
        visiteurId:       funnelAttribution.visiteurId,
        source:           funnelAttribution.source,
      })
    });

    var data;
    try { data = await resp.json(); } catch (e) {
      showAlert('Network error (' + resp.status + '). Check your connection and try again.');
      return;
    }
    if (!resp.ok) {
      showAlert(data.error || 'Error ' + resp.status + ' while setting up your payment.');
      return;
    }
    if (!data.quote) {
      showAlert('Price summary unavailable. Go back to the summary and try again.');
      return;
    }
    if (!data.clientSecret) {
      showAlert('Invalid server response. Go back to the summary and try again.');
      return;
    }
    if (!data.publishableKey) {
      showAlert('Payment configuration missing. Please contact support.');
      return;
    }

    /* Le devis rendu est celui qui a produit l'intent : affichage == débit. */
    quote = data.quote;
    renderSummary(quote);
    renderTrialNote(quote);

    _mode = data.mode || 'setup';
    _payBtnLabel = submitLabel();

    if (typeof Stripe === 'undefined') {
      showAlert(stripeLoadMessage(), true);
      return;
    }

    try { stripe = Stripe(data.publishableKey); }
    catch (e) {
      showAlert('[S1] Invalid Stripe key: ' + (e.message || e));
      return;
    }

    var appearance = stripeAppearance();
    // Langue de Stripe = langue de l'interface FlowPoint (anglais par defaut, francais si choisi),
    // jamais celle du navigateur.
    var stripeLocale = stripeLocaleFor();
    try { elements = stripe.elements({ clientSecret: data.clientSecret, appearance: appearance, locale: stripeLocale }); }
    catch (e) {
      showAlert('[S2] stripe.elements(): ' + (e.message || e));
      return;
    }

    /* Payment Element — carte + SEPA uniquement (allow_redirects:'never').
       Pré-remplissage nom + email depuis pending_signups via data.defaultValues. */
    var _peDefaultValues = {};
    if (data.defaultValues) {
      var _dv = data.defaultValues;
      var _bd = {};
      if (_dv.name)  _bd.name  = _dv.name;
      if (_dv.email) _bd.email = _dv.email;
      if (Object.keys(_bd).length) _peDefaultValues = { billingDetails: _bd };
    }
    var paymentElement;
    try {
      paymentElement = elements.create('payment', {
        layout: { type: 'tabs', defaultCollapsed: false },
        wallets: { googlePay: 'never', applePay: 'never' },
        defaultValues: Object.keys(_peDefaultValues).length ? _peDefaultValues : undefined,
      });
      paymentElement.mount('#fp-payment-element');
    } catch (e) {
      showAlert('[S3] Payment Element: ' + (e.message || e));
      return;
    }

    paymentElement.on('ready', function () {
      _paymentReady = true;
      _tryEnablePayBtn();
    });
    paymentElement.on('loaderror', function (e) {
      console.error('[FlowPoint Payment] PaymentElement loaderror', e);
      var le = e && e.error ? (e.error.code || e.error.type || '') : '';
      showAlert(('The payment form could not be displayed (connection or Stripe service temporarily unavailable).' + (le ? ' [' + le + ']' : '') + ' Try again.'), true);
    });

    /* Filet de sécurité : activer le bouton après 8s même si 'ready' ne part pas */
    setTimeout(function () {
      _paymentReady = true;
      _tryEnablePayBtn();
    }, 8000);

    document.getElementById('fp-pay-btn').setAttribute('data-mode', _mode);
  }

  requireAuthenticatedCheckout().then(function (allowed) {
    if (!allowed) return;
    return initStripe().catch(function (err) {
      console.error('[FlowPoint Payment] initStripe error', err);
      var msg = (err && (err.message || err.toString())) || 'unknown error';
      showAlert('Loading error: ' + msg + '. Go back to the summary and try again.');
    });
  });

  /* ── Soumission ── */
  document.getElementById('fp-pay-btn').addEventListener('click', async function () {
    if (this.disabled) return;
    hideAlert();
    setLoading(true, 'Verifying…');

    var mode      = this.getAttribute('data-mode') || 'payment';
    var returnUrl = window.location.origin + '/checkout-return.html';

    try {
      var result;
      if (mode === 'payment') {
        result = await stripe.confirmPayment({
          elements: elements,
          confirmParams: { return_url: returnUrl },
        });
      } else {
        result = await stripe.confirmSetup({
          elements: elements,
          confirmParams: { return_url: returnUrl },
        });
      }
      if (result.error) {
        var msg = result.error.message || 'The payment failed. Check your details and try again.';
        /* Mesure d'abandon : l'etape seule, jamais le motif ni le message Stripe.
           Sans consentement analytique, fpFunnelAttribution() est vide : rien n'est emis. */
        try {
          var failAttr = fpFunnelAttribution();
          if (failAttr.visiteurId) {
            window.fetch('/api/public/funnel-event', {
              method: 'POST', credentials: 'include', keepalive: true,
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ etape: 'checkout_payment_failed', visiteurId: failAttr.visiteurId, source: failAttr.source })
            }).catch(function () {});
          }
        } catch (e) { /* une mesure ratee ne doit jamais gener le paiement */ }
        showAlert(msg);
        setLoading(false, submitLabel());
        return;
      }

      /*
       * Stripe does not redirect for every successful card confirmation.
       * In particular, confirmSetup() resolves with a succeeded SetupIntent
       * when no 3DS/authentication step is needed. Continue the same return
       * flow explicitly so the account is finalized instead of leaving the
       * user on a disabled-looking payment page.
       */
      var confirmedIntent = mode === 'payment' ? result.paymentIntent : result.setupIntent;
      if (confirmedIntent && confirmedIntent.id) {
        var returnParams = new URLSearchParams();
        returnParams.set(mode === 'payment' ? 'payment_intent' : 'setup_intent', confirmedIntent.id);
        returnParams.set('redirect_status', confirmedIntent.status || 'succeeded');
        window.location.href = returnUrl + '?' + returnParams.toString();
        return;
      }

      showAlert('The Stripe confirmation is incomplete. Try again or contact support.');
      setLoading(false, submitLabel());
    } catch (err) {
      console.error('[FlowPoint Payment]', err);
      showAlert('Something went wrong. Try again or contact support.');
      setLoading(false);
    }
  });

})();
</script>
</body>
</html>
