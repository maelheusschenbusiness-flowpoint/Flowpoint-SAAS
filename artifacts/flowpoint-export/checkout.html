<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="fp-meta-tc" name="theme-color" content="#f8faff"/>
  <title>Paiement — FlowPoint</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('fp-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('fp-meta-tc').content = t === 'dark' ? '#050810' : '#f8faff';
      } catch(e){}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --fp-bg: #f8faff; --fp-surface: #ffffff; --fp-border: rgba(0,0,0,0.08);
      --fp-text: #0f172a; --fp-text-muted: #64748b; --fp-accent: #2563eb;
      --fp-shadow: 0 4px 24px rgba(37,99,235,0.08), 0 1px 3px rgba(0,0,0,0.06);
    }
    html[data-theme="dark"] {
      --fp-bg: #050810; --fp-surface: #0d1117; --fp-border: rgba(255,255,255,0.08);
      --fp-text: #f1f5f9; --fp-text-muted: #94a3b8;
      --fp-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--fp-bg); color: var(--fp-text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .fp-card {
      background: var(--fp-surface); border: 1px solid var(--fp-border);
      border-radius: 14px; box-shadow: var(--fp-shadow);
      padding: 48px 36px; max-width: 420px; width: 100%; text-align: center;
    }
    .fp-icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--fp-text-muted); line-height: 1.6; margin-bottom: 8px; }
    .fp-spinner-wrap { display: flex; justify-content: center; margin: 24px 0; }
    .fp-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--fp-border); border-top-color: var(--fp-accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fp-btn {
      display: inline-block; margin-top: 16px; padding: 10px 24px;
      background: var(--fp-accent); color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    #fp-error { display: none; }
  </style>
</head>
<body>
  <div class="fp-card">
    <div id="fp-loading">
      <div class="fp-icon">💳</div>
      <h1>Préparation du paiement…</h1>
      <p>Vous allez être redirigé vers notre page de paiement sécurisée.</p>
      <div class="fp-spinner-wrap"><div class="fp-spinner"></div></div>
    </div>
    <div id="fp-error">
      <div class="fp-icon">⚠️</div>
      <h1>Erreur</h1>
      <p id="fp-error-msg">Impossible d'initialiser le paiement.</p>
      <a href="/pricing" class="fp-btn">Retour aux tarifs</a>
    </div>
  </div>
  <script src="fp-config.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
