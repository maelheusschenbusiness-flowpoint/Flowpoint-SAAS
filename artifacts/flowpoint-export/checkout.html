<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){var t;try{t=localStorage.getItem('fp:theme')||localStorage.getItem('fp-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;})();</script>
  <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" id="fp-meta-tc" content="#0b1120"/>
  <title>Summary — FlowPoint</title>
  <script src="/fp-locale.js?v=20261030"></script>
  <script src="/funnel-theme.js?v=20261110" defer></script>
  <script src="/funnel-offer.js?v=20261110"></script>
  <link rel="stylesheet" href="/funnel-theme.css?v=20261110">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Tokens: /funnel-theme.css. Page-only aliases below. */
    :root { --radius: 16px; --green-brd: var(--green-border); --amber: #fbbf24; --amber-bg: rgba(234,179,8,.08); --amber-border: rgba(234,179,8,.25); }
    html[data-theme="light"] { --amber: #92400e; --amber-bg: rgba(217,119,6,.08); --amber-border: rgba(217,119,6,.3); }
    html[data-theme="dark"] .fp-card { background: rgba(8,14,30,0.94); border-color: rgba(255,255,255,0.07); }

    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px; line-height: 1.5;
    }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 32px 16px 64px; }

    /* ── Logo ── */
    .fp-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 28px; }
    .fp-logo-name { font-size: 20px; font-weight: 800; letter-spacing: -.4px; color: var(--text); }
    .fp-logo-name span { color: var(--blue-light); }

    /* ── Steps ── */
    .fp-steps { display: flex; align-items: center; gap: 0; margin-bottom: 28px; font-size: 12px; font-weight: 600; }
    .fp-step { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    .fp-step.active { color: var(--blue-light); }
    .fp-step.done { color: var(--green); }
    .fp-step-num { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .fp-step.done .fp-step-num { background: var(--green-bg); border-color: var(--green-brd); }
    .fp-step.active .fp-step-num { background: rgba(37,99,235,0.12); border-color: rgba(37,99,235,0.4); }
    .fp-step-sep { width: 28px; height: 1.5px; background: var(--border); margin: 0 8px; flex-shrink: 0; }

    /* ── Wrap ── */
    .fp-wrap { width: 100%; max-width: 540px; }

    /* ── Card ── */
    .fp-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 12px;
    }

    /* ── Section head ── */
    .fp-sec { padding: 18px 24px 0; }
    .fp-sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 12px; }

    /* ── Plan block ── */
    .fp-plan-block { display: flex; align-items: center; gap: 14px; padding: 14px 24px 18px; border-bottom: 1px solid var(--border); }
    .fp-plan-icon { width: 42px; height: 42px; border-radius: 10px; background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .fp-plan-info { flex: 1; min-width: 0; }
    .fp-plan-name { font-size: 15px; font-weight: 700; }
    .fp-plan-sub  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .fp-plan-price-wrap { text-align: right; flex-shrink: 0; white-space: nowrap; }
    .fp-plan-price { font-size: 18px; font-weight: 800; color: var(--text); white-space: nowrap; }
    .fp-plan-price-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

    /* ── Addon rows ── */
    .fp-addon-list { padding: 4px 0 8px; }
    .fp-addon-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 24px; gap: 10px; }
    .fp-addon-row + .fp-addon-row { border-top: 1px solid rgba(255,255,255,0.04); }
    html[data-theme="light"] .fp-addon-row + .fp-addon-row { border-top-color: rgba(0,0,0,0.04); }
    .fp-addon-row-left { flex: 1; min-width: 0; }
    .fp-addon-name { font-size: 13px; color: var(--text-soft); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fp-addon-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .fp-addon-price { font-size: 13px; font-weight: 600; color: var(--text); }
    .fp-addon-price.muted { color: var(--text-muted); font-weight: 400; }

    /* ── Divider ── */
    .fp-divider { height: 1px; background: var(--border); margin: 0; }

    /* ── Totals ── */
    .fp-totals { padding: 14px 24px 18px; display: flex; flex-direction: column; gap: 8px; }
    .fp-total-row { display: flex; justify-content: space-between; align-items: center; }
    .fp-total-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .fp-total-amount { font-size: 22px; font-weight: 800; color: var(--blue-light); }
    .fp-total-amount.secondary { font-size: 16px; color: var(--green); }
    .fp-total-unit { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }

    /* ── Badges ── */
    .fp-badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 20px; padding: 2px 7px; vertical-align: middle; white-space: nowrap; }
    .fp-badge-trial { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-brd); }
    .fp-badge-now   { background: rgba(37,99,235,0.1); color: var(--blue-light); border: 1px solid rgba(37,99,235,0.2); }
    .fp-badge-incl  { background: rgba(100,116,139,0.1); color: var(--text-muted); border: 1px solid rgba(100,116,139,0.2); }
    .fp-badge-one   { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }

    /* ── CTA card ── */
    .fp-cta-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); }
    html[data-theme="dark"] .fp-cta-card { background: rgba(8,14,30,0.94); border-color: rgba(255,255,255,0.07); }

    .fp-info-list { list-style: none; margin-bottom: 18px; display: flex; flex-direction: column; gap: 5px; }
    .fp-info-list li { display: flex; gap: 8px; font-size: 12.5px; color: var(--text-soft); align-items: flex-start; }
    .fp-info-list li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }

    .fp-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 20px; border: none; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s, opacity .15s; text-decoration: none; }
    .fp-btn-primary { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: #fff; box-shadow: 0 4px 16px rgba(37,99,235,0.3); margin-bottom: 10px; }
    .fp-btn-primary:hover:not(:disabled) { background: linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%); }
    .fp-btn-primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .fp-btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 13px; font-weight: 500; padding: 11px; }
    .fp-btn-ghost:hover { border-color: var(--blue); color: var(--blue-light); }

    .fp-lock-note { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }

    /* ── Alert ── */
    .fp-alert { display: none; border-radius: 10px; padding: 13px 16px; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .fp-alert.show { display: block; }
    .fp-alert-error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .fp-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin 1.2s linear infinite; flex-shrink: 0; }

    /* ── Empty ── */
    .fp-empty { text-align: center; padding: 48px 24px; }
    .fp-empty-icon { font-size: 48px; margin-bottom: 16px; }
    .fp-empty h2 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    .fp-empty p { font-size: 14px; color: var(--text-soft); margin-bottom: 24px; }
    .fp-empty .fp-btn-primary { max-width: 260px; margin: 0 auto; }

    /* ── Plan selector (no plan mode) ── */
    .fp-plan-req-banner { background: var(--amber-bg); border: 1px solid var(--amber-border); border-radius: 12px; padding: 13px 16px; font-size: 13px; color: var(--amber); display: flex; gap: 9px; align-items: flex-start; margin-bottom: 16px; }
    .fp-plan-req-banner::before { content: '⚠'; flex-shrink: 0; font-size: 14px; }
    .fp-plan-picker { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .fp-plan-pick-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; display: flex; align-items: center; justify-content: space-between; gap: 16px; position: relative; }
    html[data-theme="dark"] .fp-plan-pick-card { background: rgba(8,14,30,0.9); }
    .fp-plan-pick-card:hover { border-color: rgba(37,99,235,0.4); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
    .fp-plan-pick-card.selected { border-color: rgba(37,99,235,0.6); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .fp-plan-pick-card.featured { border-color: rgba(37,99,235,0.25); }
    .fp-plan-pick-badge { position: absolute; top: -10px; left: 18px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 10px; border-radius: 20px; }
    .fp-plan-pick-left { flex: 1; min-width: 0; }
    .fp-plan-pick-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .fp-plan-pick-desc { font-size: 12px; color: var(--text-muted); }
    .fp-plan-pick-right { text-align: right; flex-shrink: 0; }
    .fp-plan-pick-price { font-size: 18px; font-weight: 800; color: var(--blue-light); }
    .fp-plan-pick-right .fp-trial-offer, .fp-plan-price-wrap .fp-trial-offer { align-items: flex-end; }
    .fp-plan-pick-reassure { margin: -4px 0 16px; }
    @media (max-width: 480px) { .fp-plan-price-wrap .fp-trial-offer { align-items: flex-start; } }
    .fp-plan-pick-unit  { font-size: 11px; color: var(--text-muted); }
    .fp-plan-pick-btn { margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 3px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; }
    .fp-plan-pick-card:hover .fp-plan-pick-btn,
    .fp-plan-pick-card.selected .fp-plan-pick-btn { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* ── Separator label ── */
    .fp-group-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); padding: 10px 24px 2px; }

    @media (max-width: 480px) {
      .fp-plan-block { flex-wrap: wrap; }
      .fp-plan-price-wrap { flex-basis: 100%; text-align: left; margin-top: 4px; }
    }
  </style>
</head>
<body>

<!-- Logo -->
<a href="/pricing.html" class="fp-logo">
  <img src="/assets/flowpoint-logo.svg" width="34" height="34" alt="FlowPoint" aria-hidden="true" style="display:block">
  <span class="fp-logo-name">Flow<span>Point</span></span>
</a>

<!-- Steps -->
<div class="fp-steps">
  <div class="fp-step done">
    <div class="fp-step-num">✓</div>
    <span>Plans</span>
  </div>
  <div class="fp-step-sep"></div>
  <div class="fp-step active">
    <div class="fp-step-num">2</div>
    <span>Summary</span>
  </div>
  <div class="fp-step-sep"></div>
  <div class="fp-step">
    <div class="fp-step-num">3</div>
    <span>Payment</span>
  </div>
</div>

<!-- Wrap -->
<div class="fp-wrap">

  <div id="fp-alert-error" class="fp-alert fp-alert-error" role="alert"></div>

  <!-- Empty state -->
  <div id="fp-empty" class="fp-empty" style="display:none">
    <div class="fp-empty-icon">🛒</div>
    <h2>Your cart is empty</h2>
    <p>Pick a plan, an add-on or AI credits on the pricing page to get started.</p>
    <a href="/pricing.html" class="fp-btn fp-btn-primary">See plans →</a>
  </div>

  <!-- Plan required banner + picker -->
  <div id="fp-plan-required" style="display:none">
    <div class="fp-plan-req-banner">
      Choose a FlowPoint plan to activate your workspace. A plan is required.
    </div>
    <div class="fp-plan-picker" id="fp-plan-cards"></div>
    <p class="fp-trial-reassure fp-plan-pick-reassure" id="fp-plan-reassure"></p>
  </div>

  <!-- Summary card (filled by JS) -->
  <div class="fp-card" id="fp-summary-card" style="display:none"></div>

  <!-- CTA card -->
  <div class="fp-cta-card" id="fp-cta-card" style="display:none">

    <ul class="fp-info-list" id="fp-info-list"></ul>
    <div id="fp-alert-error2" class="fp-alert fp-alert-error" role="alert"></div>
    <button class="fp-btn fp-btn-primary" id="fp-pay-btn" onclick="startPayment()">
      <span id="fp-btn-text">Continue to secure payment →</span>
      <span class="fp-spinner" id="fp-spinner" style="display:none"></span>
    </button>
    <p class="fp-trial-reassure" id="fp-cta-reassure" style="margin:-2px 0 12px"></p>
    <a href="/pricing.html" class="fp-btn fp-btn-ghost">← Edit my cart</a>
    <p class="fp-lock-note">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure payment by Stripe · TLS encryption
    </p>
  </div>

</div><!-- /.fp-wrap -->

<script>
(function () {
  'use strict';

  /* ──────────────────────────────────────────────────────────────────────
     SOURCE UNIQUE : le serveur.
       • /api/plans/catalog  → noms, descriptions, clés valides, inclusions
       • /api/billing/quote  → TOUS les montants affichés
     Cette page ne contient aucun prix, aucun catalogue et aucune matrice
     d'inclusion. Le panier localStorage ne transporte qu'une sélection.
     ────────────────────────────────────────────────────────────────────── */

  var catalog = null;   /* /api/plans/catalog */
  var quote   = null;   /* /api/billing/quote — seule source de montants */
  var cart    = null;
  var _fpAuthOrgId = null;

  /* ── Helpers ── */
  function el(id) { return document.getElementById(id); }
  /* Rendu partagé avec signin.html : funnel-offer.js. */
  function eur(minor) { return window.FPOffer.eur(minor); }
  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function showError(msg) {
    var a = el('fp-alert-error');
    if (!a) return;
    a.textContent = msg;
    a.classList.add('show');
    a.style.display = 'block';
  }
  function hideError() {
    var a = el('fp-alert-error');
    if (!a) return;
    a.classList.remove('show');
    a.style.display = 'none';
  }
  function saveCart() {
    if (!cart) return;
    cart._v = 1; cart._orgId = _fpAuthOrgId; cart._updatedAt = Date.now();
    try { localStorage.setItem('fp_cart', JSON.stringify(cart)); } catch (e) {}
  }
  function addonCount() { return cart ? Object.keys(cart.addons || {}).length : 0; }
  function authHeaders() {
    try {
      var token = sessionStorage.getItem('fp_session_token') || '';
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    } catch (e) { return {}; }
  }
  function preRegisterToken() {
    try {
      var token = sessionStorage.getItem('fp_pre_reg_token') || '';
      if (token) return token;
      var stored = JSON.parse(localStorage.getItem('fp_pre_reg_token') || 'null');
      return stored && stored.token && stored.exp > Date.now() ? stored.token : '';
    } catch (e) { return ''; }
  }
  function rememberCheckoutIntent() {
    try {
      localStorage.setItem('flowpoint_pending_checkout', JSON.stringify({
        cart: cart,
        sellerRef: localStorage.getItem('fp_seller_ref') || '',
        next: '/checkout.html',
        exp: Date.now() + 1800000
      }));
      sessionStorage.setItem('fp_next', '/checkout.html');
    } catch (e) {}
  }
  async function requireAuthenticatedCheckout() {
    var resp = null;
    try {
      resp = await fetch('/api/me', {
        credentials: 'include',
        headers: Object.assign({ 'Cache-Control': 'no-cache' }, authHeaders())
      });
    } catch (e) {}
    if (resp && resp.ok) {
      try {
        var me = await resp.json();
        _fpAuthOrgId = (me && me.email) || null;
      } catch (e) {}
      return true;
    }
    /* The pre-registration token is the existing new-account continuation.
       Ordinary visitors must authenticate before the quote is requested. */
    if (preRegisterToken()) return true;
    rememberCheckoutIntent();
    window.location.replace('/signin.html?next=' + encodeURIComponent('/checkout.html'));
    return false;
  }

  /* ── Handlers exposés à l'inline onclick : portée globale de l'IIFE ── */

  window.startPayment = function () {
    var btn = el('fp-pay-btn');
    if (!btn || btn.disabled) return;
    saveCart();
    btn.disabled = true;
    el('fp-btn-text').textContent = 'Redirecting…';
    el('fp-spinner').style.display = 'inline-block';
    window.location.href = '/checkout-payment.html';
  };

  window.selectPlanFromCard = function (key) {
    if (!catalog) return;
    if (!catalog.plans.some(function (p) { return p.id === key; })) return;
    if (!cart) cart = { plan: null, addons: {} };
    cart.plan = key;
    saveCart();
    document.querySelectorAll('.fp-plan-pick-card').forEach(function (c) { c.classList.remove('selected'); });
    var card = el('ppc-' + key);
    if (card) card.classList.add('selected');
    el('fp-plan-required').style.display = 'none';
    refreshQuote();
  };

  /* ── Offre d'essai : dérivée du devis serveur uniquement (jamais codée en dur) ── */
  function trialDaysOf(q) { return window.FPOffer.trialDaysOf(q); }
  function offerHtml(priceMinor, trialDays) { return window.FPOffer.offerHtml(priceMinor, trialDays); }
  function ctaLabel(q) {
    var days = trialDaysOf(q);
    if (cart && cart.plan && days > 0) return 'Start my ' + days + '-day free trial →';
    return 'Continue to secure payment →';
  }
  function ctaReassure(q) {
    var due = Number(q && q.amountDueTodayMinor) || 0;
    if (cart && cart.plan && trialDaysOf(q) > 0 && due === 0) return '€0 today · Card required · Cancel anytime';
    if (cart && cart.plan && trialDaysOf(q) > 0) return eur(due) + ' today (add-ons) · Card required · Cancel anytime';
    return eur(due) + ' due today · Cancel anytime';
  }

  /* ── Rendu : sélecteur de plan (catalogue serveur + essai du devis serveur) ── */
  function renderPlanPicker() {
    var days = trialDaysOf(quote);
    var html = '';
    catalog.plans.forEach(function (p) {
      var featured = /^recommand/i.test(String(p.badge || ''));
      html += '<div class="fp-plan-pick-card' + (featured ? ' featured' : '') + '" id="ppc-' + escHtml(p.id) + '"' +
        ' onclick="selectPlanFromCard(\'' + escHtml(p.id) + '\')">' +
        (featured ? '<div class="fp-plan-pick-badge">Most popular</div>' : '') +
        '<div class="fp-plan-pick-left">' +
          '<div class="fp-plan-pick-name">' + escHtml(p.name) + ' plan</div>' +
          '<div class="fp-plan-pick-desc">' + escHtml(p.tagline) + '</div>' +
          '<button type="button" class="fp-plan-pick-btn">' + (days > 0 ? 'Start free trial' : 'Choose this plan') + '</button>' +
        '</div>' +
        '<div class="fp-plan-pick-right">' + offerHtml(p.priceMinor, days) + '</div>' +
      '</div>';
    });
    el('fp-plan-cards').innerHTML = html;
    // Le plan est gratuit aujourd'hui ; des add-ons mensuels du panier, eux, sont factures maintenant.
    var dueAddons = Number(quote && quote.amountDueTodayMinor) || 0;
    el('fp-plan-reassure').textContent = days > 0
      ? (dueAddons > 0 ? '€0 today for the plan · ' + eur(dueAddons) + ' today for add-ons · Card required · Cancel anytime'
                       : '€0 today · Card required · Cancel anytime')
      : 'Card required · Cancel anytime';
  }

  /* ── Rendu : récapitulatif, exclusivement depuis le devis serveur ── */
  function renderSummary(q) {
    var lines      = q.lines || [];
    var planLine   = lines.filter(function (l) { return l.kind === 'plan'; })[0] || null;
    var addonLines = lines.filter(function (l) { return l.kind === 'addon'; });

    var monthlyNow = addonLines.filter(function (l) { return !l.includedInPlan && l.interval === 'month'; });
    var includedLn = addonLines.filter(function (l) { return l.includedInPlan; });
    var oneTimeLn  = addonLines.filter(function (l) { return !l.includedInPlan && l.interval === 'one_time'; });

    var days = trialDaysOf(q);
    var onTrial = days > 0;
    var html = '';

    if (planLine) {
      html += '<div class="fp-plan-block">' +
        '<div class="fp-plan-icon">' +
          '<svg width="20" height="20" viewBox="0 0 48 48" fill="none" aria-hidden="true"><polygon points="25 4 5 28 23 28 22 44 42 20 24 20 25 4" fill="#3b82f6"/></svg>' +
        '</div>' +
        '<div class="fp-plan-info">' +
          '<div class="fp-plan-name">' + escHtml(planLine.name) + ' plan' +
            (onTrial ? '<span class="fp-badge fp-badge-trial" style="margin-left:8px">Free trial</span>' : '') +
          '</div>' +
          (onTrial
            ? '<div class="fp-plan-sub">Then ' + eur(planLine.amountMinor) + '/month after your ' + days + '-day trial. Cancel anytime before to avoid being charged.</div>'
            : '<div class="fp-plan-sub">Monthly · no commitment · cancel anytime</div>') +
        '</div>' +
        '<div class="fp-plan-price-wrap">' +
          (onTrial
            ? offerHtml(planLine.amountMinor, days)
            : '<div class="fp-plan-price">' + eur(planLine.amountMinor) + '</div><div class="fp-plan-price-sub">/month</div>') +
        '</div>' +
      '</div>';
    }

    if (monthlyNow.length) {
      html += '<div class="fp-group-label">Add-ons active from today</div><div class="fp-addon-list">';
      monthlyNow.forEach(function (l) {
        html += '<div class="fp-addon-row">' +
          '<div class="fp-addon-row-left"><div class="fp-addon-name">' + escHtml(l.name) +
            (l.quantity > 1 ? ' <span style="color:var(--text-muted);font-size:11px">×' + l.quantity + '</span>' : '') +
            ' <span class="fp-badge fp-badge-now">Billed today</span></div>' +
          '<div style="font-size:11px;color:var(--green);margin-top:2px">Activated immediately</div></div>' +
          '<div class="fp-addon-right"><span class="fp-addon-price">' + eur(l.amountMinor) +
            '<span style="font-size:10px;font-weight:400;color:var(--text-muted)">/month</span></span></div>' +
        '</div>';
      });
      html += '</div>';
    }

    if (includedLn.length) {
      html += '<div class="fp-group-label">Included in the plan</div><div class="fp-addon-list">';
      includedLn.forEach(function (l) {
        html += '<div class="fp-addon-row">' +
          '<div class="fp-addon-row-left"><div class="fp-addon-name">' + escHtml(l.name) +
            ' <span class="fp-badge fp-badge-incl">Included</span></div></div>' +
          '<div class="fp-addon-right"><span class="fp-addon-price muted">€0</span></div>' +
        '</div>';
      });
      html += '</div>';
    }

    if (oneTimeLn.length) {
      html += '<div class="fp-group-label">AI credits — one-time purchase</div><div class="fp-addon-list">';
      oneTimeLn.forEach(function (l) {
        html += '<div class="fp-addon-row">' +
          '<div class="fp-addon-row-left"><div class="fp-addon-name">' + escHtml(l.name) +
            (l.quantity > 1 ? ' <span style="color:var(--text-muted);font-size:11px">×' + l.quantity + '</span>' : '') +
            ' <span class="fp-badge fp-badge-one">One-time</span></div>' +
          '<div style="font-size:11px;color:var(--green);margin-top:2px">Credits available immediately</div></div>' +
          '<div class="fp-addon-right"><span class="fp-addon-price">' + eur(l.amountMinor) + '</span></div>' +
        '</div>';
      });
      html += '</div>';
    }

    html += '<div class="fp-divider"></div><div class="fp-totals">';
    html += '<div class="fp-total-row">' +
      '<span class="fp-total-label">Due today</span>' +
      '<span class="fp-total-amount">' + eur(q.amountDueTodayMinor) + '</span></div>';

    if (q.recurringAmountMinor > 0) {
      html += '<div class="fp-total-row">' +
        '<span class="fp-total-label">' + (onTrial ? 'Monthly after ' + days + ' days' : 'Monthly') + '</span>' +
        '<span class="fp-total-amount secondary">' + eur(q.recurringAmountMinor) +
          '<span class="fp-total-unit">/month</span></span></div>';
    }
    html += '</div>';

    el('fp-summary-card').innerHTML = html;

    /* ── Encadré d'information ── */
    var items = [];
    if (planLine && onTrial) {
      items.push(days + '-day free trial · €0 charged today for the plan.');
      items.push('Card required · then ' + eur(planLine.amountMinor) + '/month after your trial unless you cancel before it ends.');
    }
    if (monthlyNow.length)   items.push('Add-ons billed today · active immediately · renewed every month.');
    if (oneTimeLn.length)    items.push('AI credits charged now · one-time purchase.');
    items.push('Cancel anytime · payments secured by Stripe.');
    el('fp-info-list').innerHTML = items.map(function (t) { return '<li>' + escHtml(t) + '</li>'; }).join('');
  }

  /* ── Devis serveur ── */
  async function fetchQuote() {
    var resp = await fetch('/api/billing/quote', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        plan: cart.plan || '',
        addons: cart.addons || {},
        preRegisterToken: preRegisterToken()
      })
    });
    var data;
    try { data = await resp.json(); } catch (e) { throw new Error('Unreadable server response (' + resp.status + ').'); }
    if (!resp.ok || !data.quote) {
      var errorMessage = data.error || 'Price summary unavailable (' + resp.status + ').';
      if (data.code === 'ADDON_NOT_SOLD_SEPARATELY') {
        errorMessage = 'This add-on is not sold separately.';
      }
      throw new Error(errorMessage);
    }
    return data.quote;
  }

  async function refreshQuote() {
    try {
      hideError();
      quote = await fetchQuote();
      renderSummary(quote);
      el('fp-summary-card').style.display = 'block';
      el('fp-cta-card').style.display = 'block';
      el('fp-pay-btn').disabled = false;
      el('fp-btn-text').textContent = ctaLabel(quote);
      el('fp-cta-reassure').textContent = ctaReassure(quote);
    } catch (err) {
      showError(err.message || 'We could not calculate the amount. Please try again.');
      el('fp-pay-btn').disabled = true;
    }
  }

  /* ── Amorçage ── */
  async function main() {
    /* Read the selection before the auth gate so an anonymous redirect cannot
       overwrite the visitor's cart with an empty pending intent. */
    try { cart = JSON.parse(localStorage.getItem('fp_cart') || 'null'); } catch (e) {}
    if (!cart) {
      var earlyParams = new URLSearchParams(window.location.search);
      var earlyPlan = (earlyParams.get('plan') || '').toLowerCase();
      if (earlyPlan) cart = { plan: earlyPlan, addons: {} };
    }
    if (!await requireAuthenticatedCheckout()) return;
    /* Identité (pour le versionnage du panier uniquement — jamais pour les prix) */
    var hasCookie = document.cookie.split(';').some(function (c) { return c.trim().indexOf('fp_token=') === 0; });
    if (hasCookie) {
      try {
        var r = await fetch('/api/me', { credentials: 'include', headers: { 'Cache-Control': 'no-cache' } });
        if (r.ok) { var me = await r.json(); _fpAuthOrgId = (me && me.email) || null; }
      } catch (e) {}
    }

    /* Catalogue canonique */
    try {
      var cr = await fetch('/api/plans/catalog');
      if (!cr.ok) throw new Error('catalog ' + cr.status);
      catalog = await cr.json();
    } catch (e) {
      showError('Plans are unavailable right now. Reload the page in a moment.');
      return;
    }
    var planIds  = catalog.plans.map(function (p) { return p.id; });
    var addonMap = {};
    catalog.addons.forEach(function (a) { addonMap[a.key] = a; });

    /* Panier + versionnage */
    try { cart = JSON.parse(localStorage.getItem('fp_cart') || 'null'); } catch (e) {}
    if (cart && cart._v === 1) {
      var age      = Date.now() - (cart._updatedAt || 0);
      var mismatch = _fpAuthOrgId && cart._orgId && cart._orgId !== _fpAuthOrgId;
      if (age > 3600000 || mismatch) {
        try { localStorage.removeItem('fp_cart'); } catch (e) {}
        cart = null;
      }
    }

    /* Assainissement contre le catalogue serveur */
    if (cart) {
      if (cart.plan && planIds.indexOf(cart.plan) === -1) cart.plan = null;
      if (cart.addons && typeof cart.addons === 'object') {
        Object.keys(cart.addons).forEach(function (k) {
          if (!addonMap[k]) delete cart.addons[k];
        });
      } else {
        cart.addons = {};
      }
      saveCart();
    }

    /* Reprise depuis l'URL */
    if (!cart || (!cart.plan && !Object.keys(cart.addons || {}).length)) {
      var params     = new URLSearchParams(window.location.search);
      var planParam  = (params.get('plan') || '').toLowerCase();
      var addonParam = params.get('addon') || '';
      if (planParam && planIds.indexOf(planParam) !== -1) {
        cart = { plan: planParam, addons: {} };
        if (addonParam && addonMap[addonParam]) cart.addons[addonParam] = 1;
      }
    }

    var hasPlan   = !!(cart && cart.plan);
    var hasAddons = addonCount() > 0;

    if (!hasPlan && !hasAddons) {
      el('fp-empty').style.display = 'block';
      return;
    }

    if (!hasPlan && hasAddons) {
      var keys       = Object.keys(cart.addons);
      var allOneTime = keys.every(function (k) { return addonMap[k] && addonMap[k].oneTime; });

      /* Crédits IA seuls, ou abonné existant ajoutant des add-ons → pas de plan requis.
         isSubscribedFromCache: vérifie l'état local pour les abonnés actifs arrivant via
         n'importe quel chemin (pas seulement fromDashboard). */
      var _dsCache = null;
      try { _dsCache = JSON.parse(localStorage.getItem('fp_dashboard_state') || 'null'); } catch(e) {}
      var isSubscribedFromCache = _dsCache && (_dsCache.status === 'active' || _dsCache.status === 'trialing' || _dsCache.status === 'past_due');
      if (allOneTime || cart.fromDashboard || isSubscribedFromCache) {
        await refreshQuote();
        return;
      }

      /* Add-ons mensuels sans plan → sélection d'un plan obligatoire */
      await refreshQuote();
      renderPlanPicker();
      el('fp-plan-required').style.display = 'block';
      el('fp-pay-btn').disabled = true;
      el('fp-btn-text').textContent = 'Choose a plan first';
      return;
    }

    await refreshQuote();
  }

  main().catch(function (err) {
    console.error('[FlowPoint Checkout]', err);
    showError('Something went wrong while loading. Reload the page or go back to plans.');
  });

})();
</script>
</body>
</html>
