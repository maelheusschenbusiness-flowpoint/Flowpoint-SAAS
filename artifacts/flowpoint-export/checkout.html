<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paiement — FlowPoint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1120; --bg2: #111827; --surface: #1e293b;
      --border: #2d3f55; --blue: #2563eb; --blue-h: #1d4ed8;
      --blue-light: #3b82f6; --text: #f1f5f9; --text-soft: #94a3b8; --text-muted: #64748b;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f8fafc; --bg2: #ffffff; --surface: #f1f5f9; --border: rgba(0,0,0,.1); --text: #0f172a; --text-soft: #475569; --text-muted: #94a3b8; }
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; gap: 24px; }

    .fp-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .fp-logo-name { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .fp-logo-name span { color: var(--blue-light); }

    .fp-card {
      width: 100%; max-width: 500px; background: var(--bg2);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 36px 36px 32px; box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }

    .fp-card-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .fp-card-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

    .fp-summary { display: flex; flex-direction: column; gap: 0; margin-bottom: 24px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .fp-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; gap: 12px; }
    .fp-summary-row:last-child { border-bottom: none; }
    .fp-summary-row-label { color: var(--text-soft); }
    .fp-summary-row-price { font-weight: 700; color: var(--text); white-space: nowrap; }
    .fp-summary-plan-label { font-weight: 600; }
    .fp-summary-trial { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .fp-summary-total { background: rgba(37,99,235,0.06); border-top: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .fp-summary-total-label { font-size: 13px; font-weight: 700; }
    .fp-summary-total-amount { font-size: 16px; font-weight: 800; color: var(--blue-light); }
    .fp-summary-trial-note { font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 16px; }

    .fp-badge-trial { display: inline-block; font-size: 11px; font-weight: 600; background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); border-radius: 20px; padding: 2px 8px; margin-left: 6px; }
    .fp-badge-now { display: inline-block; font-size: 11px; font-weight: 600; background: rgba(37,99,235,0.1); color: var(--blue-light); border: 1px solid rgba(37,99,235,0.2); border-radius: 20px; padding: 2px 8px; margin-left: 6px; }

    .fp-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 20px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s, opacity .15s;
      text-decoration: none;
    }
    .fp-btn-primary { background: var(--blue); color: #fff; margin-bottom: 10px; }
    .fp-btn-primary:hover:not(:disabled) { background: var(--blue-h); }
    .fp-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .fp-btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); font-size: 13px; font-weight: 500; padding: 11px; }
    .fp-btn-secondary:hover { border-color: var(--blue); color: var(--blue-light); }

    .fp-lock-note { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-top: 14px; }

    .fp-error { display: none; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: #fca5a5; margin-bottom: 20px; line-height: 1.5; }
    .fp-error.show { display: block; }

    .fp-empty { text-align: center; padding: 20px 0; }
    .fp-empty-icon { font-size: 40px; margin-bottom: 14px; }
    .fp-empty p { font-size: 14px; color: var(--text-soft); margin-bottom: 20px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .fp-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .7s linear infinite; }

    @media (max-width: 520px) { .fp-card { padding: 28px 20px 24px; border-radius: 14px; } }
  </style>
</head>
<body>

<a href="/pricing.html" class="fp-logo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36">
    <defs><linearGradient id="fp-co-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient></defs>
    <rect width="48" height="48" rx="10" ry="10" fill="url(#fp-co-g)"/>
    <g transform="translate(12,12)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </g>
  </svg>
  <span class="fp-logo-name">Flow<span>Point</span></span>
</a>

<div class="fp-card">
  <div id="fp-error" class="fp-error"></div>

  <div id="fp-content">
    <div class="fp-card-title">Récapitulatif de commande</div>
    <div class="fp-card-sub">Vérifiez votre sélection avant de passer au paiement sécurisé.</div>

    <div class="fp-summary" id="fp-summary"></div>
    <p class="fp-summary-trial-note" id="fp-trial-note"></p>

    <button class="fp-btn fp-btn-primary" id="fp-pay-btn" onclick="startPayment()">
      <span class="fp-btn-text">Payer et activer →</span>
      <span class="fp-spinner" style="display:none" id="fp-spinner"></span>
    </button>
    <a href="/pricing.html" class="fp-btn fp-btn-secondary">← Modifier la sélection</a>

    <p class="fp-lock-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Paiement sécurisé par Stripe · Données chiffrées
    </p>
  </div>

  <div id="fp-empty" class="fp-empty" style="display:none">
    <div class="fp-empty-icon">🛒</div>
    <p>Votre panier est vide.<br>Sélectionnez un plan ou un add-on depuis la page tarifs.</p>
    <a href="/pricing.html" class="fp-btn fp-btn-primary">Voir les tarifs →</a>
  </div>
</div>

<script>
(function () {
  'use strict';

  var PLAN_INFO = {
    standard: { name: 'Plan Standard', price: 29 },
    pro:      { name: 'Plan Pro',      price: 79 },
    ultra:    { name: 'Plan Ultra',    price: 149 }
  };
  var ADDON_INFO = {
    monitorsPack50:    { name: 'Pack monitors +50',         price: 9,  unit: '/pack/mois', qty: true },
    extraSeats:        { name: 'Siège supplémentaire',      price: 12, unit: '/siège/mois', qty: true },
    aiCreditsPack50k:  { name: '+50 000 crédits IA',        price: 19, unit: '/pack/mois', qty: true },
    prioritySupport:   { name: 'Support prioritaire ≤ 2h', price: 29, unit: '/mois' },
    retention90d:      { name: 'Rétention 90 jours',       price: 14, unit: '/mois' },
    whiteLabel:        { name: 'White-label complet',       price: 39, unit: '/mois' },
    aiExecutiveReport: { name: 'Rapport exécutif IA',       price: 29, unit: '/mois' },
    revenueLeak:       { name: 'Revenue Leak Detection',    price: 49, unit: '/mois' },
    auditsPack200:     { name: 'Pack audits +200',          price: 12, unit: '/pack/mois', qty: true },
    auditsPack1000:    { name: 'Pack audits +1 000',        price: 39, unit: '/pack/mois', qty: true },
    pdfPack200:        { name: 'Pack PDF +200',             price: 12, unit: '/pack/mois', qty: true },
    exportsPack1000:   { name: 'Pack exports +1 000',       price: 14, unit: '/pack/mois', qty: true },
    retention365d:     { name: 'Rétention 365 jours',      price: 29, unit: '/mois' },
    customDomain:      { name: 'Domaine personnalisé',      price: 15, unit: '/mois' },
    aiForecasting:     { name: 'Prévisions IA',             price: 29, unit: '/mois' },
    aiCro:             { name: 'CRO IA',                    price: 39, unit: '/mois' },
    behavioralAI:      { name: 'Behavioral AI',             price: 49, unit: '/mois' },
    aiWorkflows:       { name: 'Workflows IA',              price: 29, unit: '/mois' },
    marketIntelligence:{ name: 'Market Intelligence',       price: 49, unit: '/mois' },
    reviewIntelligence:{ name: 'Review Intelligence',       price: 19, unit: '/mois' },
    aiCreditsPack200k: { name: '+200 000 crédits IA',       price: 49, unit: '/pack/mois', qty: true },
    aiCreditsPack500k: { name: '+500 000 crédits IA',       price: 99, unit: '/pack/mois', qty: true },
    zapierIntegration: { name: 'Zapier / Make',             price: 15, unit: '/mois' },
    advancedWebhooks:  { name: 'Webhooks avancés',          price: 19, unit: '/mois' },
    crmIntegration:    { name: 'Intégration CRM',           price: 29, unit: '/mois' },
    agencyPacks:       { name: 'Agency Packs',              price: 99, unit: '/mois' },
    ssoEnterprise:     { name: 'SSO Enterprise',            price: 99, unit: '/mois' }
  };

  var cart = null;
  try { cart = JSON.parse(localStorage.getItem('fp_cart') || 'null'); } catch(e) {}

  var hasPlan   = cart && cart.plan && PLAN_INFO[cart.plan];
  var hasAddons = cart && cart.addons && Object.keys(cart.addons).length > 0;

  if (!hasPlan && !hasAddons) {
    document.getElementById('fp-content').style.display = 'none';
    document.getElementById('fp-empty').style.display = 'block';
    return;
  }

  /* ── Build summary ── */
  var summaryEl   = document.getElementById('fp-summary');
  var trialNoteEl = document.getElementById('fp-trial-note');
  var addonTotal  = 0;
  var rows = '';

  if (hasPlan) {
    var p = PLAN_INFO[cart.plan];
    rows += '<div class="fp-summary-row">' +
      '<div><div class="fp-summary-plan-label">' + p.name + ' <span class="fp-badge-trial">14j d\'essai gratuit</span></div>' +
      '<div class="fp-summary-trial">Débit de ' + p.price + '€/mois après l\'essai</div></div>' +
      '<div class="fp-summary-row-price">0€ maintenant</div></div>';
  }

  if (hasAddons) {
    Object.keys(cart.addons).forEach(function (id) {
      var info = ADDON_INFO[id];
      if (!info) return;
      var qty = cart.addons[id] || 1;
      var lineTotal = info.price * qty;
      addonTotal += lineTotal;
      var label = info.name + (qty > 1 ? ' × ' + qty : '') + ' <span class="fp-badge-now">Immédiat</span>';
      rows += '<div class="fp-summary-row">' +
        '<div class="fp-summary-row-label">' + label + '</div>' +
        '<div class="fp-summary-row-price">' + lineTotal + '€<small style="font-weight:400;color:var(--text-muted)">' + info.unit + '</small></div></div>';
    });
  }

  var totalLabel = hasPlan && addonTotal > 0
    ? 'Aujourd\'hui (add-ons uniquement)'
    : hasPlan ? 'Aujourd\'hui (essai gratuit)' : 'Total aujourd\'hui';
  var totalAmount = addonTotal + '€';

  summaryEl.innerHTML = rows +
    '<div class="fp-summary-total">' +
    '<span class="fp-summary-total-label">' + totalLabel + '</span>' +
    '<span class="fp-summary-total-amount">' + totalAmount + '</span></div>';

  if (hasPlan) {
    trialNoteEl.textContent = 'Le plan sera facturé à la fin des 14 jours d\'essai. Annulation sans frais avant la fin de la période.';
  }

  /* ── Start payment ── */
  window.startPayment = function () {
    var btn    = document.getElementById('fp-pay-btn');
    var txt    = btn.querySelector('.fp-btn-text');
    var spin   = document.getElementById('fp-spinner');
    var errEl  = document.getElementById('fp-error');
    errEl.classList.remove('show');
    btn.disabled = true;
    txt.style.display = 'none';
    spin.style.display = 'inline-block';

    var body = {};
    if (hasPlan) body.plan = cart.plan;
    if (hasAddons) body.addons = cart.addons;

    fetch('/api/billing/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(body)
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, data: d }; }); })
    .then(function (res) {
      if (res.status === 401) {
        try { sessionStorage.setItem('fp_next', '/checkout.html'); } catch(ex) {}
        window.location.href = '/login.html?next=' + encodeURIComponent('/checkout.html');
        return;
      }
      if (!res.ok || !res.data.url) throw new Error(res.data.error || 'Impossible de créer la session de paiement.');
      window.location.href = res.data.url;
    })
    .catch(function (err) {
      btn.disabled = false;
      txt.style.display = '';
      spin.style.display = 'none';
      errEl.textContent = err.message || 'Une erreur est survenue. Veuillez réessayer.';
      errEl.classList.add('show');
    });
  };

})();
</script>
</body>
</html>
