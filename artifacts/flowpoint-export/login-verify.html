<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script>(function(){var t;try{t=localStorage.getItem('fp:theme')||localStorage.getItem('fp-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}catch(e){t='dark';}}document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;})();</script>
  <link rel="stylesheet" href="/funnel-theme.css?v=20261110">
  <script src="/funnel-theme.js?v=20261110" defer></script>
  <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="fp-meta-tc" name="theme-color" content="#f8faff"/>
  <script src="/fp-locale.js?v=20261025"></script>
  <title>Verifying — FlowPoint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Alias des anciens noms --fp-* vers les jetons partagés (funnel-theme.css). */
    :root, html[data-theme="light"] {
      --fp-bg: var(--bg); --fp-surface: var(--bg2); --fp-border: var(--border);
      --fp-text: var(--text); --fp-text-muted: var(--text-soft); --fp-accent: var(--blue);
      --fp-shadow: var(--shadow);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--fp-bg); color: var(--fp-text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .fp-card {
      background: var(--fp-surface); border: 1px solid var(--fp-border);
      border-radius: 12px; box-shadow: var(--fp-shadow);
      padding: 48px 36px; max-width: 400px; width: 100%; text-align: center;
    }
    .fp-icon { font-size: 48px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--fp-text-muted); line-height: 1.6; }
    .fp-spinner-wrap { display: flex; justify-content: center; margin: 24px 0; }
    .fp-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--fp-border);
      border-top-color: var(--fp-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fp-btn {
      display: inline-block; margin-top: 20px; padding: 10px 24px;
      background: var(--fp-accent); color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    .fp-btn:hover { background: var(--blue-h); }
    #fp-error { display: none; }
    #fp-error .fp-icon { font-size: 40px; }
    #fp-success { display: none; }
    #fp-success .fp-icon { font-size: 40px; }
    #fp-loading { display: block; }
  </style>
</head>
<body>
  <div class="fp-card">
    <a href="/" style="display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;text-decoration:none">
      <svg viewBox="0 0 48 48" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lv-logo-g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#4F46E5"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="10" fill="url(#lv-logo-g)"/>
        <g transform="translate(12,12)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </g>
      </svg>
      <span style="font-size:18px;font-weight:800;color:var(--fp-text);letter-spacing:-0.4px">FlowPoint</span>
    </a>
    <div id="fp-loading">
      <div class="fp-icon">🔐</div>
      <h1>Verifying…</h1>
      <p>We are checking your sign-in link. Please wait.</p>
      <div class="fp-spinner-wrap"><div class="fp-spinner"></div></div>
    </div>
    <div id="fp-success">
      <div class="fp-icon">✅</div>
      <h1>You are signed in!</h1>
      <p>Redirecting you to your dashboard…</p>
      <div class="fp-spinner-wrap"><div class="fp-spinner"></div></div>
    </div>
    <div id="fp-error">
      <div class="fp-icon">❌</div>
      <h1>Invalid link</h1>
      <p id="fp-error-msg">This sign-in link is invalid or has expired.</p>
      <!-- fp-retry-btn is shown by login-verify.js when the server returns canRetry:true
           (expired / already_used / not_found).  Hidden by default. -->
      <button id="fp-retry-btn" class="fp-btn" style="display:none;margin-top:12px;">
        Request a new link
      </button>
      <a href="/login.html" class="fp-btn" style="margin-top:8px;">Back to sign in</a>
    </div>
  </div>
  <script src="fp-config.js"></script>
  <script src="login-verify.js"></script>
</body>
</html>
