<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="fp-meta-tc" name="theme-color" content="#f8faff"/>
  <title>Paiement confirmé — FlowPoint</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('fp-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('fp-meta-tc').content = t === 'dark' ? '#050810' : '#f8faff';
      } catch(e){}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --fp-bg: #f8faff; --fp-surface: #ffffff; --fp-border: rgba(0,0,0,0.08);
      --fp-text: #0f172a; --fp-text-muted: #64748b; --fp-accent: #2563eb;
      --fp-shadow: 0 4px 24px rgba(37,99,235,0.08), 0 1px 3px rgba(0,0,0,0.06);
    }
    html[data-theme="dark"] {
      --fp-bg: #050810; --fp-surface: #0d1117; --fp-border: rgba(255,255,255,0.08);
      --fp-text: #f1f5f9; --fp-text-muted: #94a3b8;
      --fp-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--fp-bg); color: var(--fp-text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .fp-card {
      background: var(--fp-surface); border: 1px solid rgba(16,185,129,0.25);
      border-radius: 14px; box-shadow: var(--fp-shadow);
      padding: 52px 40px; max-width: 440px; width: 100%; text-align: center;
    }
    .fp-success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(16,185,129,0.12); display: flex; align-items: center;
      justify-content: center; margin: 0 auto 24px; font-size: 36px;
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #059669; }
    html[data-theme="dark"] h1 { color: #34d399; }
    p { font-size: 14px; color: var(--fp-text-muted); line-height: 1.6; margin-bottom: 8px; }
    .fp-features {
      background: var(--fp-bg); border-radius: 10px;
      padding: 16px 20px; margin: 24px 0; text-align: left;
    }
    .fp-features li {
      font-size: 13px; padding: 5px 0; list-style: none;
      display: flex; align-items: center; gap: 8px; color: var(--fp-text-muted);
    }
    .fp-features li::before { content: '✓'; color: #059669; font-weight: 700; }
    html[data-theme="dark"] .fp-features li::before { color: #34d399; }
    .fp-cta {
      display: inline-block; padding: 13px 32px;
      background: var(--fp-accent); color: #fff; border: none;
      border-radius: 9px; font-size: 15px; font-weight: 700;
      cursor: pointer; text-decoration: none; transition: background 0.15s;
    }
    .fp-cta:hover { background: #1d4ed8; }
    .fp-counter { font-size: 12px; color: var(--fp-text-muted); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="fp-card">
    <div class="fp-success-icon">🎉</div>
    <h1>Paiement confirmé !</h1>
    <p>Votre abonnement FlowPoint est maintenant actif. Bienvenue dans la croissance.</p>

    <ul class="fp-features">
      <li>Accès complet à votre tableau de bord</li>
      <li>Monitors d'uptime activés</li>
      <li>Analyses SEO disponibles</li>
      <li>Support prioritaire débloqué</li>
    </ul>

    <a href="/" class="fp-cta">Accéder au tableau de bord</a>
    <div class="fp-counter" id="fp-counter">Redirection automatique dans <span id="fp-count">10</span>s</div>
  </div>

  <script src="fp-config.js"></script>
  <script>
    (function () {
      var count = 10;
      var el = document.getElementById('fp-count');
      var t = setInterval(function () {
        count--;
        if (el) el.textContent = count;
        if (count <= 0) { clearInterval(t); window.location.href = '/'; }
      }, 1000);
    })();
  </script>
</body>
</html>
