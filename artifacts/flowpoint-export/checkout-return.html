<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta id="fp-meta-tc" name="theme-color" content="#050810"/>
  <title>Vérification du paiement — FlowPoint</title>

  <script>
    (function(){
      try {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.getElementById('fp-meta-tc');
        if (meta) meta.content = dark ? '#050810' : '#f8faff';
      } catch(e){}
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8faff; --surface: #fff; --border: rgba(0,0,0,0.09);
      --blue: #2563eb; --text: #0f172a; --text-soft: #475569; --text-muted: #94a3b8;
    }
    html[data-theme="dark"] {
      --bg: #050810; --surface: #111827; --border: rgba(255,255,255,0.08);
      --text: #f1f5f9; --text-soft: #94a3b8; --text-muted: #64748b;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; gap: 16px; text-align: center; }
    .fp-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: fp-spin .7s linear infinite; }
    @keyframes fp-spin { to { transform: rotate(360deg); } }
    .fp-title { font-size: 18px; font-weight: 700; }
    .fp-sub { font-size: 14px; color: var(--text-soft); }
  </style>
</head>
<body>
  <div class="fp-spinner"></div>
  <div class="fp-title" id="fp-title">Vérification de votre paiement…</div>
  <div class="fp-sub" id="fp-sub">Merci de patienter quelques instants.</div>

  <script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var sessionId = params.get('session_id');

    if (!sessionId) {
      window.location.href = '/pricing.html';
      return;
    }

    var token = null;
    try { token = localStorage.getItem('fp_token') || sessionStorage.getItem('fp_token'); } catch(e){}

    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;

    fetch('/api/billing/verify?session_id=' + encodeURIComponent(sessionId), { headers: headers })
      .then(function(r){ return r.json(); })
      .then(function(data) {
        var status = (data.status || '').toLowerCase();
        if (status === 'paid' || status === 'trialing' || status === 'complete' || status === 'active') {
          try { localStorage.removeItem('fp_cart'); } catch(e){}
          window.location.href = '/success.html?session_id=' + encodeURIComponent(sessionId);
        } else if (status === 'expired' || status === 'canceled') {
          window.location.href = '/cancel.html';
        } else {
          document.getElementById('fp-title').textContent = 'Paiement en cours de traitement';
          document.getElementById('fp-sub').textContent = 'Nous mettons votre compte à jour. Vous serez redirigé automatiquement.';
          setTimeout(function(){ window.location.href = '/success.html?session_id=' + encodeURIComponent(sessionId); }, 3000);
        }
      })
      .catch(function() {
        document.getElementById('fp-title').textContent = 'Vérification impossible';
        document.getElementById('fp-sub').textContent = 'Rendez-vous sur le tableau de bord pour vérifier votre abonnement.';
        setTimeout(function(){ window.location.href = '/dashboard.html'; }, 3000);
      });
  })();
  </script>
</body>
</html>
