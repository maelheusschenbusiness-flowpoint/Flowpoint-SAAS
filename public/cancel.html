<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>
    Paiement annulé — FlowPoint
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/flowpoint-logo.svg"
  />

  <link
    rel="stylesheet"
    href="/style.css"
  />

</head>

<body class="fp-marketing">

  <div class="page">

    <div
      style="
        max-width:760px;
        margin:56px auto;
      "
    >

      <div class="hero">

        <h1>
          Paiement annulé
        </h1>

        <p>
          Aucun paiement n’a été validé.
          Ton abonnement actuel n’a pas été modifié.
        </p>

      </div>

      <div
        class="card"
        style="margin-top:16px"
      >

        <div class="cardBody">

          <div class="small">

            Tu peux relancer le checkout
            quand tu veux depuis les offres
            ou les add-ons.

          </div>

          <div
            style="
              display:flex;
              gap:12px;
              flex-wrap:wrap;
              margin-top:16px;
            "
          >

            <a
              class="primaryBtn"
              href="/pricing.html"
              style="
                text-decoration:none;
                display:flex;
                align-items:center;
                justify-content:center;
              "
            >
              Retour au pricing
            </a>

            <a
              class="ghostBtn"
              href="/dashboard.html"
              style="
                text-decoration:none;
                display:flex;
                align-items:center;
                justify-content:center;
              "
            >
              Dashboard
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
