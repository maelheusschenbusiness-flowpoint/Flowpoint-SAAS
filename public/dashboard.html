<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8"/>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>
    FlowPoint Dashboard
  </title>

  <meta
    name="color-scheme"
    content="dark"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/flowpoint-logo.svg"
  />

  <link
    rel="shortcut icon"
    href="/assets/flowpoint-logo.svg"
  />

  <!-- IMPORTANT -->
  <!-- PAS style.css -->

  <link
    rel="stylesheet"
    href="/dashboard.css"
  />

</head>

<body>

  <!-- LOADING -->

  <div
    id="fpLoadingScreen"
    class="fpLoadingScreen"
  >

    <div class="fpLoadingCard">

      <div class="fpLoadingLogoWrap">

        <img
          src="/assets/flowpoint-logo.svg"
          alt="FlowPoint"
          class="fpLoadingLogo"
        />

      </div>

      <div class="fpLoadingTitle">
        FlowPoint
      </div>

      <div class="fpLoadingText">
        Chargement du workspace...
      </div>

    </div>

  </div>

  <!-- APP -->

  <div id="app"></div>

  <!-- TOASTS -->

  <div
    id="fpToastWrap"
    class="fpToastWrap"
  ></div>

  <!-- ERROR -->

  <div
    id="fpFatalError"
    class="fpFatalError"
    style="display:none"
  >

    <div class="fpFatalErrorCard">

      <div class="fpFatalErrorTitle">
        Erreur dashboard
      </div>

      <div
        id="fpFatalErrorText"
        class="fpFatalErrorText"
      >
        Impossible de charger le workspace.
      </div>

      <button
        class="fpFatalErrorBtn"
        onclick="location.reload()"
      >
        Recharger
      </button>

    </div>

  </div>

  <!-- IMPORTANT -->

  <script>

    window.FLOWPOINT_CONFIG = {

      API_BASE:
        '',

      VERSION:
        'v3',

      APP_NAME:
        'FlowPoint',

    };

  </script>

  <!-- IMPORTANT -->
  <!-- PAS app.js -->
  <!-- PAS bootstrap.js -->
  <!-- PAS style.css -->

  <script src="/dashboard.js"></script>

</body>
</html>
