<!DOCTYPE html>
<html
  lang="fr"
  data-theme="dark"
>

<head>

  <!-- =====================================================
       META
  ====================================================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <title>
    FlowPoint — Enterprise Dashboard
  </title>

  <meta
    name="robots"
    content="noindex,nofollow"
  />

  <meta
    name="theme-color"
    content="#070b19"
  />

  <meta
    name="description"
    content="FlowPoint Enterprise Control Center"
  />

  <!-- =====================================================
       FONTS
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- =====================================================
       CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="dashboard.css"
  />

  <!-- =====================================================
       FAVICON
  ====================================================== -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/flowpoint-logo.svg"
  />

</head>

<body>

  <!-- =====================================================
       TOAST WRAP
  ====================================================== -->

  <div
    id="fpToastWrap"
  ></div>

  <!-- =====================================================
       LOADING SCREEN
  ====================================================== -->

  <div
    id="fpLoadingScreen"
  ></div>

  <!-- =====================================================
       FATAL ERROR
  ====================================================== -->

  <div
    id="fpFatalError"
  >

    <div>

      <h1>
        FlowPoint Error
      </h1>

      <p>
        Impossible de charger le dashboard.
      </p>

    </div>

  </div>

  <!-- =====================================================
       APP ROOT
  ====================================================== -->

  <div
    id="app"
  ></div>
  
  <!-- =====================================================
       MODAL ROOT
  ====================================================== -->

  <div
    id="fpModalRoot"
  ></div>

  <!-- =====================================================
       FLOATING OVERLAYS
  ====================================================== -->

  <div
    id="fpOverlay"
    class="fp-overlay"
  ></div>

  <!-- =====================================================
       GLOBAL HELPERS
  ====================================================== -->

  <script>

    window.FLOWPOINT_ENV = {

      production:
        location.hostname !==
        'localhost',

      apiBase:
        '',

      version:
        '4.0.0',

    };

    window.addEventListener(

      'error',

      event => {

        console.error(

          '[FP Front Error]',

          event.error ||
          event.message
        );
      }
    );

    window.addEventListener(

      'unhandledrejection',

      event => {

        console.error(

          '[FP Promise Error]',

          event.reason
        );
      }
    );

  </script>

  <!-- =====================================================
       DASHBOARD ENGINE
  ====================================================== -->

  <script
    src="dashboard.js"
  ></script>

</body>
</html>
