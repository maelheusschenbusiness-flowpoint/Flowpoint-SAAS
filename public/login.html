<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8"/>

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>
    FlowPoint — Connexion
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="/assets/flowpoint-logo.svg"
  />

  <link
    rel="stylesheet"
    href="/style.css"
  />

</head>

<body class="fp-marketing">

  <div class="page">

    <div
      style="
        max-width:560px;
        margin:60px auto;
      "
    >

      <div class="cardForm">

        <div class="brand">

          <div class="logoBox">
            <img
              class="brandLogo"
              src="/assets/flowpoint-logo.svg"
              alt="FlowPoint"
            />
          </div>

          <div>

            <h1
              style="
                font-size:30px;
                font-weight:900;
                margin-bottom:6px;
              "
            >
              Connexion
            </h1>

            <div class="small">
              Connecte-toi à ton dashboard FlowPoint.
            </div>

          </div>

        </div>

        <div style="height:22px"></div>

        <label>
          Email
        </label>

        <input
          id="email"
          type="email"
          placeholder="toi@entreprise.com"
        />

        <label>
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          placeholder="********"
        />

        <button
          id="btn"
          class="primaryBtn"
          style="margin-top:18px"
        >
          Se connecter
        </button>

        <div
          id="msg"
          class="small"
          style="margin-top:16px"
        >
          —
        </div>

        <div
          style="
            margin-top:18px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
          "
        >

          <a
            class="linkBtn"
            href="/index.html"
          >
            Créer un compte
          </a>

          <a
            class="linkBtn"
            href="/pricing.html"
          >
            Voir les offres
          </a>

        </div>

      </div>

    </div>

  </div>

<script src="/login.js"></script>

</body>
</html>
