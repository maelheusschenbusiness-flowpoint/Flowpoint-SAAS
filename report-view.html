<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Rapport Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #2563EB;
      --brand-dark:  #1d4ed8;
      --brand-glow:  rgba(37,99,235,0.18);
      --bg:          #050810;
      --bg-card:     rgba(255,255,255,0.03);
      --border:      rgba(255,255,255,0.07);
      --text:        #f1f5ff;
      --text-soft:   #c8d8f8;
      --text-muted:  #94a3b8;
      --text-faint:  #4b5e8a;
      --success:     #22c55e;
      --warning:     #f59e0b;
      --danger:      #ef4444;
      --radius:      12px;
      --font-head:   'Outfit', system-ui, sans-serif;
      --font-body:   'Inter', system-ui, sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(900px 600px at 5% 0%, var(--brand-glow), transparent 55%),
        radial-gradient(800px 500px at 100% 10%, rgba(139,92,246,0.08), transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, #070d1e 50%, var(--bg) 100%);
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    /* ── HEADER ── */
    .rv-header {
      padding: 28px 40px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(5,8,16,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .rv-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .rv-brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 8px 24px var(--brand-glow);
      overflow: hidden;
    }

    .rv-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .rv-brand-name {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
    }

    .rv-brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .rv-header-meta {
      text-align: right;
    }

    .rv-header-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .rv-confidential {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.25);
      font-size: 10px;
      font-weight: 700;
      color: var(--warning);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── MAIN ── */
    .rv-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* ── REPORT TITLE BLOCK ── */
    .rv-report-title-block {
      margin-bottom: 32px;
      padding: 28px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .rv-report-title-block::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--brand), var(--brand-dark), transparent);
    }

    .rv-report-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(37,99,235,0.25);
      font-size: 10px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .rv-report-name {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .rv-report-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .rv-report-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .rv-report-meta-item svg { opacity: 0.6; }

    /* ── SECTION ── */
    .rv-section {
      margin-bottom: 28px;
    }

    .rv-section-title {
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rv-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── KPI GRID ── */
    .rv-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .rv-kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .rv-kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      opacity: 0.5;
    }

    .rv-kpi-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .rv-kpi-value {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .rv-kpi-trend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .rv-kpi-trend.up   { color: var(--success); }
    .rv-kpi-trend.down { color: var(--danger); }
    .rv-kpi-trend.neutral { color: var(--text-muted); }

    /* ── SITE TABLE ── */
    .rv-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .rv-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rv-table th {
      padding: 11px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      border-bottom: 1px solid var(--border);
    }

    .rv-table td {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-soft);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .rv-table tr:last-child td { border-bottom: none; }

    .rv-score-bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rv-score-bar-track {
      width: 56px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .rv-score-bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .rv-score-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
    }

    .rv-status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 5px;
    }

    /* ── RECOMMENDATIONS ── */
    .rv-reco-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rv-reco-item {
      display: flex;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      align-items: flex-start;
    }

    .rv-reco-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .rv-reco-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .rv-reco-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .rv-impact {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 8px;
    }

    .rv-impact.high   { background: rgba(239,68,68,0.12);   color: var(--danger);  border: 1px solid rgba(239,68,68,0.2); }
    .rv-impact.medium { background: rgba(245,158,11,0.12);  color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
    .rv-impact.low    { background: rgba(34,197,94,0.12);   color: var(--success); border: 1px solid rgba(34,197,94,0.2); }

    /* ── SEO SCORE CIRCLE ── */
    .rv-score-circle-wrap {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }

    .rv-score-circle svg { display: block; }

    .rv-score-info { flex: 1; min-width: 160px; }

    .rv-score-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .rv-score-big {
      font-family: var(--font-head);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
    }

    .rv-score-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rv-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid;
    }

    /* ── FOOTER ── */
    .rv-footer {
      border-top: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(5,8,16,0.6);
    }

    .rv-footer-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rv-footer-logo {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-head);
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .rv-footer-logo img { width: 100%; height: 100%; object-fit: contain; }

    .rv-footer-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
    }

    .rv-footer-msg {
      font-size: 11px;
      color: var(--text-faint);
    }

    .rv-footer-powered {
      font-size: 10px;
      color: var(--text-faint);
    }

    .rv-footer-powered a {
      color: var(--brand);
      text-decoration: none;
    }

    /* ── EXPIRY / INVALID STATES ── */
    .rv-error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      gap: 14px;
      padding: 40px;
    }

    .rv-error-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .rv-error-title {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .rv-error-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.6;
    }

    /* ── DEMO BANNER ── */
    .rv-demo-banner {
      background: rgba(37,99,235,0.12);
      border-bottom: 1px solid rgba(37,99,235,0.2);
      padding: 10px 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #93c5fd;
    }

    @media (max-width: 600px) {
      .rv-header { padding: 16px 20px; }
      .rv-main { padding: 24px 16px 60px; }
      .rv-footer { padding: 16px 20px; }
      .rv-report-title-block { padding: 20px; }
      .rv-kpi-grid { grid-template-columns: repeat(2,1fr); }
    }

    @media print {
      body { background: #fff; color: #000; }
      body::before { display: none; }
      .rv-header { position: static; background: #fff; }
      .rv-footer { background: #fff; }
    }
  </style>
</head>
<body>

<div id="rv-app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;gap:12px;flex-direction:column">
    <div style="width:40px;height:40px;border-radius:50%;border:3px solid rgba(37,99,235,0.2);border-top-color:#2563EB;animation:spin 0.7s linear infinite"></div>
    <div style="font-size:13px;color:var(--text-muted)">Chargement du rapport…</div>
  </div>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
(function() {
  'use strict';

  function escHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function scoreColor(score) {
    if (score >= 75) return '#22c55e';
    if (score >= 50) return '#f59e0b';
    return '#ef4444';
  }

  function relDate(d) {
    try {
      const date = new Date(d);
      return date.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    } catch(e) { return d; }
  }

  function avgScore(audits) {
    if (!audits || !audits.length) return 72;
    return Math.round(audits.reduce((s,a) => s + (a.score||0), 0) / audits.length);
  }

  function render(data) {
    const { report, branding, audits, meetingNotes } = data;
    const primary    = branding.primaryColor   || '#2563EB';
    const secondary  = branding.secondaryColor || '#1d4ed8';
    const agencyName = branding.agencyName     || 'Mon Agence';
    const logoUrl    = branding.logoUrl        || '';
    const footerMsg  = branding.footerMsg      || '';

    document.title = escHtml(report.name) + ' — ' + escHtml(agencyName);

    document.documentElement.style.setProperty('--brand',       primary);
    document.documentElement.style.setProperty('--brand-dark',  secondary);
    document.documentElement.style.setProperty('--brand-glow',  hexToRgba(primary, 0.18));

    const avg = avgScore(audits);
    const scoreC = scoreColor(avg);
    const circ   = 2 * Math.PI * 44;
    const dash   = (avg / 100) * circ;
    const isDemo = !data._tokenValid;

    const logoHtml = logoUrl
      ? `<div class="rv-brand-logo" style="background:#fff"><img src="${escHtml(logoUrl)}" alt="${escHtml(agencyName)}" onerror="this.parentNode.innerHTML='${escHtml(agencyName.charAt(0).toUpperCase())}'"/></div>`
      : `<div class="rv-brand-logo" style="background:linear-gradient(135deg,${escHtml(primary)},${escHtml(secondary)})">${escHtml(agencyName.charAt(0).toUpperCase())}</div>`;

    const footerLogoHtml = logoUrl
      ? `<div class="rv-footer-logo" style="background:#fff"><img src="${escHtml(logoUrl)}" alt="${escHtml(agencyName)}" onerror="this.parentNode.innerHTML='${escHtml(agencyName.charAt(0).toUpperCase())}'"/></div>`
      : `<div class="rv-footer-logo" style="background:linear-gradient(135deg,${escHtml(primary)},${escHtml(secondary)})">${escHtml(agencyName.charAt(0).toUpperCase())}</div>`;

    const statusMap = { ok:'#22c55e', warn:'#f59e0b', error:'#ef4444', up:'#22c55e', down:'#ef4444' };

    const recos = [
      { emoji:'🔍', title:'Optimiser les balises title', desc:'Plusieurs pages manquent de balises title optimisées. Impact direct sur le CTR dans les résultats Google.', impact:'high' },
      { emoji:'⚡', title:'Améliorer la vitesse de chargement', desc:'Le score de performance mobile est inférieur à 60/100 sur certains sites. Pensez à compresser les images.', impact:'medium' },
      { emoji:'🗺️', title:'Compléter les fiches Google Business', desc:'Les photos et horaires de certains établissements ne sont pas à jour. Indispensable pour le référencement local.', impact:'medium' },
      { emoji:'🔗', title:'Corriger les liens brisés', desc:'Nous avons détecté des redirections 404. Chaque lien cassé pénalise l\'autorité de domaine.', impact:'low' },
    ];

    const impactLabel = { high:'Impact élevé', medium:'Impact moyen', low:'Impact faible' };

    const html = `
      ${isDemo ? `<div class="rv-demo-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Aperçu démo — Partagez via le bouton "Partager" dans le dashboard pour générer un vrai lien.</div>` : ''}

      <header class="rv-header">
        <div class="rv-brand">
          ${logoHtml}
          <div>
            <div class="rv-brand-name">${escHtml(agencyName)}</div>
            <div class="rv-brand-sub">Rapport SEO client</div>
          </div>
        </div>
        <div class="rv-header-meta">
          <div class="rv-header-date">${relDate(report.date)}</div>
          <div class="rv-confidential">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Confidentiel
          </div>
        </div>
      </header>

      <main class="rv-main">

        <div class="rv-report-title-block">
          <div class="rv-report-tag">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            ${escHtml(report.type || 'PDF')}
          </div>
          <div class="rv-report-name">${escHtml(report.name)}</div>
          <div class="rv-report-meta">
            <div class="rv-report-meta-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${relDate(report.date)}
            </div>
            <div class="rv-report-meta-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              ${report.pages || 8} page${(report.pages||8) > 1 ? 's' : ''}
            </div>
            <div class="rv-report-meta-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
              Préparé par ${escHtml(agencyName)}
            </div>
          </div>
        </div>

        <div class="rv-section">
          <div class="rv-section-title">Score SEO global</div>
          <div class="rv-score-circle-wrap">
            <div class="rv-score-circle">
              <svg width="110" height="110" viewBox="0 0 110 110">
                <circle cx="55" cy="55" r="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="9"/>
                <circle cx="55" cy="55" r="44" fill="none" stroke="${scoreC}" stroke-width="9"
                  stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
                  stroke-dashoffset="${(circ * 0.25).toFixed(1)}"
                  stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:55px 55px;transition:stroke-dasharray 1.2s ease"/>
                <text x="55" y="51" text-anchor="middle" font-family="Outfit,sans-serif" font-size="22" font-weight="800" fill="${scoreC}">${avg}</text>
                <text x="55" y="66" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">/100</text>
              </svg>
            </div>
            <div class="rv-score-info">
              <div class="rv-score-label">Score moyen sur ${audits.length || 4} site${(audits.length || 4) > 1 ? 's' : ''}</div>
              <div class="rv-score-big" style="color:${scoreC}">${avg}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">
                ${avg >= 75 ? '✅ Excellent — Votre présence SEO est optimisée' : avg >= 50 ? '⚠️ Moyen — Des améliorations sont recommandées' : '❌ Critique — Une action immédiate est nécessaire'}
              </div>
              <div class="rv-score-pills">
                <span class="rv-pill" style="background:rgba(34,197,94,0.12);color:#22c55e;border-color:rgba(34,197,94,0.25)">${audits.filter(a => (a.score||0) >= 75).length} sites performants</span>
                <span class="rv-pill" style="background:rgba(245,158,11,0.12);color:#f59e0b;border-color:rgba(245,158,11,0.25)">${audits.filter(a => (a.score||0) >= 50 && (a.score||0) < 75).length} à améliorer</span>
                <span class="rv-pill" style="background:rgba(239,68,68,0.12);color:#ef4444;border-color:rgba(239,68,68,0.25)">${audits.filter(a => (a.score||0) < 50).length} critiques</span>
              </div>
            </div>
          </div>
        </div>

        <div class="rv-section">
          <div class="rv-section-title">Indicateurs clés</div>
          <div class="rv-kpi-grid">
            ${[
              { label:'Sites audités',      value: audits.length || 4, trend:'up',     suffix:'',   trendLabel:'+1 ce mois' },
              { label:'Score moyen',        value: avg,                trend: avg >= 70 ? 'up' : 'down', suffix:'/100', trendLabel: avg >= 70 ? '+3 pts' : '-2 pts' },
              { label:'Problèmes détectés', value: audits.reduce((s,a) => s + (a.issues||0), 0) || 14, trend:'down', suffix:'', trendLabel:'-6 vs mois passé' },
              { label:'Uptime moyen',       value:'99.2',              trend:'up',     suffix:'%',  trendLabel:'Tous les sites actifs' },
            ].map(k => `
              <div class="rv-kpi-card">
                <div class="rv-kpi-label">${escHtml(k.label)}</div>
                <div class="rv-kpi-value" style="color:var(--text)">${escHtml(String(k.value))}<span style="font-size:14px;color:var(--text-muted)">${escHtml(k.suffix)}</span></div>
                <div class="rv-kpi-trend ${k.trend}">
                  ${k.trend === 'up' ? '▲' : k.trend === 'down' ? '▼' : '—'}
                  ${escHtml(k.trendLabel)}
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        ${audits.length > 0 ? `
        <div class="rv-section">
          <div class="rv-section-title">Détail par site</div>
          <div class="rv-table-wrap">
            <table class="rv-table">
              <thead>
                <tr>
                  <th>Site</th>
                  <th>Score SEO</th>
                  <th>Vitesse</th>
                  <th>Statut</th>
                  <th>Problèmes</th>
                </tr>
              </thead>
              <tbody>
                ${audits.map(a => `
                  <tr>
                    <td style="font-family:var(--font-mono);font-size:11px;color:var(--text)">${escHtml(a.url || '')}</td>
                    <td>
                      <div class="rv-score-bar-wrap">
                        <div class="rv-score-bar-track">
                          <div class="rv-score-bar-fill" style="width:${a.score||0}%;background:${scoreColor(a.score||0)}"></div>
                        </div>
                        <span class="rv-score-val" style="color:${scoreColor(a.score||0)}">${a.score||0}</span>
                      </div>
                    </td>
                    <td>
                      <div class="rv-score-bar-wrap">
                        <div class="rv-score-bar-track">
                          <div class="rv-score-bar-fill" style="width:${a.speed||0}%;background:${scoreColor(a.speed||0)}"></div>
                        </div>
                        <span class="rv-score-val" style="color:${scoreColor(a.speed||0)}">${a.speed||0}</span>
                      </div>
                    </td>
                    <td>
                      <span class="rv-status-dot" style="background:${statusMap[a.status]||'#94a3b8'}"></span>
                      <span style="font-size:12px;color:${statusMap[a.status]||'#94a3b8'}">${escHtml(a.status === 'ok' ? 'OK' : a.status === 'warn' ? 'Attention' : 'Critique')}</span>
                    </td>
                    <td style="font-family:var(--font-mono);font-size:12px;color:${(a.issues||0) > 10 ? 'var(--danger)' : (a.issues||0) > 3 ? 'var(--warning)' : 'var(--success)'}">${a.issues||0}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        ` : ''}

        <div class="rv-section">
          <div class="rv-section-title">Recommandations prioritaires</div>
          <div class="rv-reco-list">
            ${recos.map(r => `
              <div class="rv-reco-item">
                <div class="rv-reco-icon" style="background:${r.impact==='high' ? 'rgba(239,68,68,0.12)' : r.impact==='medium' ? 'rgba(245,158,11,0.12)' : 'rgba(34,197,94,0.12)'}">${r.emoji}</div>
                <div style="flex:1">
                  <div class="rv-reco-title">
                    ${escHtml(r.title)}
                    <span class="rv-impact ${r.impact}">${impactLabel[r.impact]}</span>
                  </div>
                  <div class="rv-reco-desc">${escHtml(r.desc)}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        ${Array.isArray(meetingNotes) && meetingNotes.length > 0 ? `
        <div class="rv-section">
          <div class="rv-section-title">Notes de réunion</div>
          <div style="display:flex;flex-direction:column;gap:14px">
            ${meetingNotes.map(note => `
              <div style="border-left:3px solid var(--brand);padding:12px 14px;background:rgba(255,255,255,0.03);border-radius:0 8px 8px 0">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <div style="font-weight:700;font-size:13px;color:var(--rv-text)">${escHtml(note.title||'')}</div>
                  <div style="font-size:11px;color:var(--rv-muted);margin-left:auto">${note.date ? relDate(note.date) : ''}</div>
                </div>
                ${note.site ? `<div style="font-size:11px;color:var(--rv-muted);margin-bottom:6px">${escHtml(note.site.replace(/^https?:\/\//,''))}</div>` : ''}
                <div style="font-size:12px;color:var(--rv-text-soft);line-height:1.6;white-space:pre-wrap">${escHtml(note.notes||'')}</div>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

      </main>

      <footer class="rv-footer">
        <div class="rv-footer-brand">
          ${footerLogoHtml}
          <div>
            <div class="rv-footer-name">${escHtml(agencyName)}</div>
            ${footerMsg ? `<div class="rv-footer-msg">${escHtml(footerMsg)}</div>` : ''}
          </div>
        </div>
        <div class="rv-footer-powered">
          Généré avec <a href="https://flowpoint.pro" target="_blank" rel="noopener">Flowpoint</a>
          · Rapport confidentiel
          ${data.expiresAt ? '· Expire le ' + relDate(data.expiresAt) : ''}
        </div>
      </footer>
    `;

    document.getElementById('rv-app').innerHTML = html;
  }

  function renderError(title, msg) {
    document.getElementById('rv-app').innerHTML = `
      <header class="rv-header">
        <div class="rv-brand">
          <div class="rv-brand-logo">F</div>
          <div>
            <div class="rv-brand-name">Flowpoint</div>
            <div class="rv-brand-sub">Rapport client</div>
          </div>
        </div>
      </header>
      <div class="rv-error-page">
        <div class="rv-error-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="rv-error-title">${escHtml(title)}</div>
        <div class="rv-error-sub">${escHtml(msg)}</div>
      </div>
    `;
  }

  function hexToRgba(hex, alpha) {
    try {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    } catch(e) { return `rgba(37,99,235,${alpha})`; }
  }

  function getDemoData() {
    return {
      report: { id:'demo', name:'Rapport Mai 2026 — Boulangerie Martin', date:'2026-05-01', type:'PDF', pages:8 },
      branding: { agencyName:'Mon Agence SEO', logoUrl:'', primaryColor:'#2563EB', secondaryColor:'#1d4ed8', footerMsg:'' },
      audits: [
        { id:'a1', url:'boulangerie-martin.fr',   score:82, speed:91, status:'ok',    issues:3 },
        { id:'a2', url:'restaurant-lesoleil.com', score:61, speed:67, status:'warn',  issues:11 },
        { id:'a3', url:'plombier-paris.fr',       score:38, speed:44, status:'error', issues:22 },
        { id:'a4', url:'coiffeur-lyon.com',       score:75, speed:88, status:'ok',    issues:5 },
      ],
      createdAt: new Date().toISOString(),
      expiresAt: new Date(Date.now() + 30*24*3600*1000).toISOString(),
      _tokenValid: false,
    };
  }

  async function loadFromApi(token) {
    const res = await fetch('/api/share/' + encodeURIComponent(token));
    if (res.status === 410) {
      renderError('Rapport expiré', 'Ce lien de rapport a expiré. Contactez votre agence pour obtenir un lien actualisé.');
      return null;
    }
    if (!res.ok) {
      return null;
    }
    const data = await res.json();
    data._tokenValid = true;
    return data;
  }

  function loadFromLocalStorage(token) {
    const raw = localStorage.getItem('fp-share-' + token);
    if (!raw) return null;
    try {
      const data = JSON.parse(raw);
      if (data.expiresAt && new Date(data.expiresAt) < new Date()) {
        renderError('Rapport expiré', 'Ce lien de rapport a expiré. Contactez votre agence pour obtenir un lien actualisé.');
        return null;
      }
      data._tokenValid = true;
      return data;
    } catch(e) { return null; }
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const token  = params.get('token');

    if (!token) {
      const stored = localStorage.getItem('fp-wl-branding');
      const branding = stored ? JSON.parse(stored) : {};
      const demo = getDemoData();
      demo.branding = Object.assign(demo.branding, branding);
      render(demo);
      return;
    }

    let data = null;

    try {
      data = await loadFromApi(token);
    } catch(e) {
      console.warn('[report-view] API unavailable, trying localStorage fallback');
    }

    if (!data) {
      data = loadFromLocalStorage(token);
    }

    if (!data) {
      renderError('Lien invalide ou expiré', 'Ce lien de rapport n\'existe pas ou a été révoqué. Contactez votre agence pour obtenir un nouveau lien.');
      return;
    }

    render(data);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
