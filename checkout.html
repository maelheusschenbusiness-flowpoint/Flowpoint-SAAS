<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout — FlowPoint</title>
  <meta name="color-scheme" content="light dark" />

  <link rel="icon" type="image/svg+xml" href="/assets/flowpoint-logo.svg" />
  <link rel="shortcut icon" href="/assets/flowpoint-logo.svg" />
  <link rel="stylesheet" href="/style.css" />

  <style>
    .checkoutPage .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .checkoutPage .brandMini{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .checkoutPage .brandMiniLogo{
      width:40px;
      height:40px;
      border-radius:12px;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
      filter:drop-shadow(0 10px 18px rgba(0,0,0,.22));
    }

    /* ✅ AJOUT TEXTE FLOWPOINT */
    .checkoutPage .brandText{
      font-size:18px;
      font-weight:600;
      color:var(--text-primary, #fff);
      letter-spacing:0.2px;
    }

    .checkoutPage .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .checkoutPage .grid{
      display:grid;
      grid-template-columns:minmax(0,1.42fr) minmax(320px,.9fr);
      gap:14px;
      align-items:stretch;
    }

    .checkoutPage .mainCol,
    .checkoutPage .side{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:14px;
      height:100%;
    }

    .checkoutPage .side{
      display:grid;
      gap:14px;
      align-content:start;
    }

    .checkoutPage .side .card:last-child{
      flex:1 1 auto;
    }

    .checkoutPage .section{
      margin-top:0;
      display:flex;
      flex-direction:column;
      height:100%;
    }

    .checkoutPage .checkoutCard{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      flex:1 1 auto;
    }

    .checkoutPage .checkoutCard .cardBody{
      display:flex;
      flex-direction:column;
      gap:12px;
      flex:1 1 auto;
    }

    .checkoutPage .checkoutShell{
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      padding:12px;
    }

    .checkoutPage .checkoutPlaceholder{
      border-radius:14px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.015);
      padding:16px;
      color:rgba(255,255,255,.82);
      font-size:14px;
      line-height:1.55;
      font-weight:800;
    }

    @media (prefers-color-scheme: light){
      .checkoutPage .checkoutShell{
        border:1px solid rgba(15,23,42,.08);
        background:rgba(15,23,42,.02);
      }

      .checkoutPage .checkoutPlaceholder{
        border:1px solid rgba(15,23,42,.07);
        background:rgba(15,23,42,.025);
        color:#334155;
      }
    }

    .checkoutPage .miniInfo{
      margin-top:auto;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.02);
      padding:14px 16px;
    }

    @media (prefers-color-scheme: light){
      .checkoutPage .miniInfo{
        border:1px solid rgba(15,23,42,.08);
        background:rgba(15,23,42,.02);
      }
    }

    .checkoutPage .miniInfoTitle{
      font-weight:800;
      margin-bottom:8px;
    }

    .miniList{
      list-style:none;
      padding:0;
      margin:0;
      display:grid;
      gap:10px;
    }

    .miniList li{
      position:relative;
      padding-left:18px;
      line-height:1.6;
      font-weight:800;
      color:var(--text);
    }

    .miniList li::before{
      content:"•";
      position:absolute;
      left:0;
      top:0;
      color:rgba(47,91,255,.95);
      font-weight:950;
    }

    #goEmbeddedBtn,
    #retryBtn{
      width:100%;
      min-height:48px;
      border-radius:14px;
      font-weight:950;
    }

    #goEmbeddedBtn{
      border:0;
      color:#fff;
      background:linear-gradient(180deg,var(--primary),var(--primary2));
      box-shadow:0 16px 50px rgba(47,91,255,.30);
    }

    #retryBtn{
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--text);
    }

    @media (prefers-color-scheme: light){
      #retryBtn{
        background:#fff;
      }
    }

    @media (max-width:980px){
      .checkoutPage .grid{
        grid-template-columns:1fr;
      }

      .checkoutPage .mainCol,
      .checkoutPage .side{
        height:auto;
      }
    }

    @media (max-width:720px){
      .checkoutPage .topbar{
        flex-direction:column;
        align-items:flex-start;
      }

      .checkoutPage .actions{
        width:100%;
        justify-content:flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="page checkoutPage">
    <div class="topbar">
      <div class="brandMini">
        <img
          class="brandMiniLogo"
          src="/assets/flowpoint-logo.svg"
          alt="FlowPoint"
          onerror="this.src='/assets/flowpoint-logo.png'"
        />
        <span class="brandText">FlowPoint</span>
      </div>

      <div class="actions">
        <a class="linkBtn" href="/pricing.html">← Retour pricing</a>
        <div class="pill" id="authPill">Statut : …</div>
      </div>
    </div>

    <div class="grid">
