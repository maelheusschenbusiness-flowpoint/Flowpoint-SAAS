<script type="module">
import {
  setAuthToken,
} from "./auth.js";

const btn =
  document.getElementById(
    "btn"
  );

const emailEl =
  document.getElementById(
    "email"
  );

const passwordEl =
  document.getElementById(
    "password"
  );

const msg =
  document.getElementById(
    "msg"
  );

function setMsg(
  text,
  type
) {
  msg.textContent = text;

  msg.classList.remove(
    "ok",
    "danger"
  );

  if (type) {
    msg.classList.add(type);
  }
}

btn.addEventListener(
  "click",
  async () => {
    try {
      btn.disabled = true;

      setMsg(
        "Connexion..."
      );

      const email =
        String(
          emailEl.value || ""
        ).trim();

      const password =
        String(
          passwordEl.value || ""
        );

      const response =
        await fetch(
          "/api/auth/login",
          {
            method: "POST",

            credentials:
              "include",

            headers: {
              "Content-Type":
                "application/json",
            },

            body: JSON.stringify({
              email,
              password,
            }),
          }
        );

      const data =
        await response.json();

      console.log(
        "LOGIN:",
        data
      );

      if (
        !response.ok ||
        !data.ok
      ) {
        throw new Error(
          data.error ||
            "Connexion impossible"
        );
      }

      if (data.token) {
        setAuthToken(
          data.token
        );
      }

      setMsg(
        "Connexion réussie",
        "ok"
      );

      setTimeout(() => {
        window.location.href =
          "/dashboard.html";
      }, 500);
    } catch (err) {
      console.error(err);

      setMsg(
        err.message,
        "danger"
      );
    } finally {
      btn.disabled = false;
    }
  }
);
</script>
